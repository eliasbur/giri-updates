  # --- General changes (top-level "Non-comprehensive list of changes in this release") ---

  - id: llvmcontext-discardvaluenames
    category: "general"
    changeType: "added"
    severity: "medium"
    summary: "LLVMContext gains new runtime check discardValueNames() to discard Value names"
    description: "The LLVMContext gains a new runtime check (see LLVMContext::discardValueNames()) that can be set to discard Value names (other than GlobalValue). This is intended to be used in release builds by clients that are interested in saving CPU/memory as much as possible."
    affectedApi:
      - "LLVMContext"
      - "LLVMContext::discardValueNames"
      - "Value"
      - "GlobalValue"
    notes: ""
    relevance: "unknown"
    status: "pending"

