    category: "general"
    changeType: "removed"
    severity: "high"
    summary: "Global context no longer available except for the C API"
    description: "There is no longer a \"global context\" available in LLVM, except for the C API."
    affectedApi:
      - "LLVMContext"
      - "global context"
    notes: ""
    relevance: "unknown"
    status: "pending"

  - id: autoconf-removed-cmake-only
    category: "general"
    changeType: "removed"
    severity: "high"
    summary: "Autoconf build system removed; CMake 3.4.3+ now required"
    description: "The autoconf build system has been removed in favor of CMake. LLVM 3.9 requires CMake 3.4.3 or later to build. For information about using CMake please see the documentation on Building LLVM with CMake. For information about the CMake language there is also a CMake Primer document available."
    affectedApi:
      - "autoconf"
      - "CMake"
    notes: ""
    relevance: "unknown"
    status: "pending"

