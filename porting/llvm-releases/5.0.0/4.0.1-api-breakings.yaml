  # --- Intrusive list API overhaul ---

  - id: intrusive-list-simple-ilist
    category: "general"
    changeType: "added"
    severity: "high"
    summary: "simple_ilist<T> introduced as lower-level intrusive list that never takes ownership of its nodes"
    description: "simple_ilist<T> is a lower-level intrusive list that never takes ownership of its nodes. New intrusive-list clients should consider using it instead of ilist<T>."
    affectedApi:
      - "simple_ilist"
      - "ilist"
    notes: "Part of extensive intrusive list API overhaul"
    relevance: "unknown"
    status: "pending"

  - id: intrusive-list-ilist-tag
    category: "general"
    changeType: "added"
    severity: "medium"
    summary: "ilist_tag<class> allows a single data type to be inserted into two parallel intrusive lists"
    description: "ilist_tag<class> allows a single data type to be inserted into two parallel intrusive lists. A type can inherit twice from ilist_node, first using ilist_node<T,ilist_tag<A>> (enabling insertion into simple_ilist<T,ilist_tag<A>>) and second using ilist_node<T,ilist_tag<B>> (enabling insertion into simple_ilist<T,ilist_tag<B>>), where A and B are arbitrary types."
    affectedApi:
      - "ilist_tag"
      - "ilist_node"
      - "simple_ilist"
    notes: "Part of intrusive list API overhaul"
    relevance: "unknown"
    status: "pending"

  - id: intrusive-list-ilist-sentinel-tracking
    category: "general"
    changeType: "added"
    severity: "medium"
    summary: "ilist_sentinel_tracking<bool> controls whether an iterator knows whether it's pointing at the sentinel (end()); enables iterator::isEnd()"
    description: "ilist_sentinel_tracking<bool> controls whether an iterator knows whether it's pointing at the sentinel (end()). By default, sentinel tracking is on when ABI-breaking checks are enabled, and off otherwise; this is used for an assertion when dereferencing end() (this assertion triggered often in practice, and many backend bugs were fixed). Explicitly turning on sentinel tracking also enables iterator::isEnd(). This is used by MachineInstrBundleIterator to iterate over bundles."
    affectedApi:
      - "ilist_sentinel_tracking"
      - "end()"
      - "iterator::isEnd()"
      - "MachineInstrBundleIterator"
    notes: "Part of intrusive list API overhaul"
    relevance: "unknown"
    status: "pending"

  - id: intrusive-list-ilist-no-allocation
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "ilist<T> now built on simple_ilist<T>, no longer supports allocating nodes, equivalent to iplist<T>"
    description: "ilist<T> is built on top of simple_ilist<T>, and supports the same configuration options. As before (and unlike simple_ilist<T>), ilist<T> takes ownership of its nodes. However, it no longer supports allocating nodes, and is now equivalent to iplist<T>."
    affectedApi:
      - "ilist"
      - "simple_ilist"
      - "iplist"
    notes: "Part of intrusive list API overhaul"
    relevance: "unknown"
    status: "pending"

