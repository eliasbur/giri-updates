    category: "general"
    changeType: "added"
    severity: "medium"
    summary: "iterator::getReverse() and reverse_iterator::getReverse() return an iterator that dereferences to the same node; begin().getReverse() equals --rend()"
    description: "iterator::getReverse() and reverse_iterator::getReverse() return an iterator that dereferences to the same node. I.e., begin().getReverse() equals --rend()."
    affectedApi:
