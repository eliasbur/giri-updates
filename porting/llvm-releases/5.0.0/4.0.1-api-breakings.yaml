    notes: "Part of intrusive list API overhaul"
    relevance: "unknown"
    status: "pending"

  - id: intrusive-list-iterator-conversion-constructors
    category: "general"
    changeType: "added"
    severity: "medium"
    summary: "iterator and reverse_iterator have explicit conversion constructors matching std::reverse_iterator's off-by-one semantics; reverse_iterator(begin()) equals rend()"
    description: "iterator and reverse_iterator have explicit conversion constructors that match std::reverse_iterator's off-by-one semantics, so that reversing the endpoints of an iterator range results in the same range (albeit in reverse). I.e., reverse_iterator(begin()) equals rend()."
    affectedApi:
      - "iterator"
      - "reverse_iterator"
      - "begin()"
      - "rend()"
      - "std::reverse_iterator"
    notes: "Part of intrusive list API overhaul"
    relevance: "unknown"
    status: "pending"

