    description: "iplist<T> will likely be removed in the future."
    affectedApi:
      - "iplist"
      - "ilist"
    notes: "Follows from ilist<T> now being equivalent to iplist<T>"
    relevance: "unknown"
    status: "pending"

  - id: intrusive-list-traits-specialization
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "ilist<T> now always uses ilist_traits<T> via specialization; clients must specialize traits rather than pass template parameter"
    description: "ilist<T> now always uses ilist_traits<T>. Instead of passing a custom traits class in via a template parameter, clients that want to customize the traits should specialize ilist_traits<T>. Clients that want to avoid ownership can specialize ilist_alloc_traits<T> to inherit from ilist_noalloc_traits<T> (or to do something funky); clients that need callbacks can specialize ilist_callback_traits<T> directly."
    affectedApi:
      - "ilist_traits"
      - "ilist_alloc_traits"
      - "ilist_noalloc_traits"
      - "ilist_callback_traits"
      - "ilist"
    notes: "Part of intrusive list API overhaul; old template parameter approach no longer works"
    relevance: "unknown"
    status: "pending"

  - id: intrusive-list-linked-list-structure
    category: "general"
    changeType: "behavior-change"
    severity: "medium"
    summary: "Underlying intrusive list data structure is now a simple recursive linked list; sentinel stored in same allocation as simple_ilist<T>"
    description: "The underlying data structure is now a simple recursive linked list. The sentinel node contains only a 'next' (begin()) and 'prev' (rbegin()) pointer and is stored in the same allocation as simple_ilist<T>. Previously, it was malloc-allocated on-demand by default, although the now-defunct ilist_sentinel_traits<T> was sometimes specialized to avoid this."
    affectedApi:
      - "simple_ilist"
      - "ilist_sentinel_traits"
      - "begin()"
      - "rbegin()"
    notes: "Part of intrusive list API overhaul"
    relevance: "unknown"
    status: "pending"

  - id: intrusive-list-reverse-iterator-rewrite
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "reverse_iterator class no longer uses std::reverse_iterator; has handle to same node it dereferences; same invalidation semantics as forward iterators"
    description: "The reverse_iterator class no longer uses std::reverse_iterator. Instead, it now has a handle to the same node that it dereferences to. Reverse iterators now have the same iterator invalidation semantics as forward iterators."
