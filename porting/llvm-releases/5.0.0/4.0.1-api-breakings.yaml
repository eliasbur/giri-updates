    category: "general"
    changeType: "added"
    severity: "medium"
    summary: "ilist_node<T>::getIterator() and ilist_node<T>::getReverseIterator() return forward/reverse iterators that dereference to the current node"
    description: "ilist_node<T>::getIterator() and ilist_node<T>::getReverseIterator() return the forward and reverse iterators that dereference to the current node. I.e., begin()->getIterator() equals begin() and rbegin()->getReverseIterator() equals rbegin()."
