    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "iterator now stores an ilist_node_base* instead of a T*; implicit conversions between ilist<T>::iterator and T* removed"
    description: "iterator now stores an ilist_node_base* instead of a T*. The implicit conversions between ilist<T>::iterator and T* have been removed. Clients may use N->getIterator() (if not nullptr) or &*I (if not end()); alternatively, clients may refactor to use references for known-good nodes."
