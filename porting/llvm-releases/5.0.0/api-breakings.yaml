group: ModuleContext
files:
  - tools/Tracer/Tracer.cpp
  - tools/PrintTrace/PrintTrace.cpp
changes:
  - old: "LLVMContext &Context = getGlobalContext();"
    new: "LLVMContext Context;"
    reason: "getGlobalContext() removed in LLVM 4.0; each module must own its context"
  - old: "OwningPtr<MemoryBuffer> BuffPtr;"
    new: 'std::unique_ptr<MemoryBuffer> BuffPtr = MemoryBuffer::getFileOrSTDIN(...).get()'
    reason: "OwningPtr removed; MemoryBuffer returns ErrorOr<unique_ptr<MemoryBuffer>> in 5.0"
  - old: "std::auto_ptr<Module> M;"
    new: "std::unique_ptr<Module> M;"
    reason: "std::auto_ptr removed in C++14; LLVM 5 requires C++14"
  - old: "llvm_shutdown_obj"
    new: "Removed; not needed with LLVM 4.0+ init system"
    reason: "llvm_shutdown_obj removed in LLVM 4.0+"
  - old: "sys::PrintStackTraceOnErrorSignal()"
    new: "sys::PrintStackTraceOnErrorSignal(cl::getProgramName())"
    reason: "Requires program name argument in LLVM 5"
  - old: "sys::RemoveFileOnSignal(OutputFilename)"
    new: "Removed; no direct replacement. Handle cleanup in signal handler or atexit."
    reason: "sys::RemoveFileOnSignal removed in LLVM 5.0+"

---
group: DataLayoutAsPass
files:
  - include/Giri/Giri.h
  - lib/Giri/TracingNoGiri.cpp
  - tools/Tracer/Tracer.cpp
changes:
  - old: 'AU.addRequired<DataLayout>()'
    new: "Remove; DataLayout is not a pass in LLVM 5"
    reason: "DataLayout-as-pass removed in LLVM 3.6+"
  - old: "TD = &getAnalysis<DataLayout>();"
    new: "TD = &F.getParent()->getDataLayout()" or "M.getDataLayout()"
    reason: "DataLayout is a Module member, not an analysis pass"
  - old: "const DataLayout *TD;"
    new: "const DataLayout *DL;" or "const DataLayout &DL"
    reason: "Variable naming; still use pointer if accessing lazily from Module"
  - old: "Passes.add(new DataLayout(M.get()));"
    new: "Remove this line entirely"

---
group: BasicBlockNumberingMetadata
files:
  - lib/Utility/BasicBlockNumbering.cpp
  - include/Utility/BasicBlockNumbering.h
  - lib/Utility/LoadStoreNumbering.cpp
  - include/Utility/LoadStoreNumbering.h
changes:
  - old: "MDNode::getWhenValsUnresolved(Context, ArrayRef<Value*>(ID, 2), false)"
    new: "MDNode::get(Context, {ConstantAsMetadata::get(BB->getGUID()), ConstantAsMetadata::get(ConstantInt::get(...))})"
    reason: "getWhenValsUnresolved removed in LLVM 3.6; MDNode operands are Metadata* not Value*"
    design_note: >
      Critical change: Stop storing BasicBlock* as MDNode operand. MDNode operands
      can no longer hold Value* directly. Store the BB's GUID (numeric integer) instead
      of the pointer. On read side, reconstruct BasicBlock* from GUID via bb lookup map.
      For LoadStoreNumbering, store instruction GUID instead of Instruction*.
      Recovery: maintain a reverse map from GUID to BasicBlock* in QueryBasicBlockNumbers.
  - old: "BasicBlock *BB = dyn_cast<BasicBlock>(Node->getOperand(0))"
    new: "unsigned guid = mdconst::dyn_extract<ConstantInt>(Node->getOperand(0))->getZExtValue()"
    reason: "MDNode operands are Metadata*, not Value*; need to extract metadata then cast"
  - old: "ConstantInt *ID = dyn_cast<ConstantInt>(Node->getOperand(1))"
    new: "uint64_t id = mdconst::extract<ConstantInt>(Node->getOperand(1))->getZExtValue()"
    reason: "MDNode::getOperand returns Metadata*; use mdconst::extract<>()"
  - old: "Value *ID[2]; ID[0] = BB; ID[1] = ConstantInt::get(...)"
    new: "Metadata *MD[] = {ConstantAsMetadata::get(ConstantInt::get(...)), ConstantAsMetadata::get(ConstantInt::get(...))}; return MDNode::get(Context, MD);"
    reason: "All MDNode operands must be Metadata*"
  - old: "Instruction *I = dyn_cast<Instruction>(Node->getOperand(0))"
    new: "unsigned guid = mdconst::dyn_extract<ConstantInt>(Node->getOperand(0))->getZExtValue()"
    reason: "Same as BB: store GUID, not pointer"
verification:
  test: "test/UnitTests/test1"
  check: "opt -load libdgutility.so -bbnum -dump-bbid=true reproduces old IDs"
risk: high
risk_reason: >
  Changing from pointer-based to GUID-based metadata storage is invasive.
  QueryBasicBlockNumbers and QueryLoadStoreNumbers must build full lookup tables
  during runOnModule to map GUID -> BasicBlock*/Instruction*.
  Must ensure GUID assignment is deterministic across instrumentation and slicing runs.

