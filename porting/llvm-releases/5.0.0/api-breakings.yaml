group: DebugInfo
files:
  - lib/Giri/Giri.cpp
  - lib/Utility/SourceLineMapping.cpp
  - include/Utility/SourceLineMapping.h
changes:
  - old: '#include "llvm/DebugInfo.h"'
    new: '#include "llvm/IR/DebugInfo.h"'
    reason: "Header moved in LLVM 3.5+"
  - old: 'MDNode *N = I->getMetadata("dbg"); DILocation Loc(N);'
    new: "const DILocation *Loc = dyn_cast<DILocation>(I->getMetadata("dbg")); "
    reason: "DILocation(MDNode) constructor removed in LLVM 3.5+; cast MDNode to DILocation"
  - old: "Loc.getDirectory()"
    new: "Loc->getDirectory()"
    reason: "DILocation is a pointer type, not value; access via -> not ."
  - old: "Loc.getFilename()"
    new: "Loc->getFilename()"
  - old: "Loc.getLineNumber()"
    new: "Loc->getLine()"
    reason: "Method renamed from getLineNumber() to getLine() in LLVM 3.5+"
verification:
  test: "test/UnitTests/test10"
  check: "criterion-loc resolution matches ans-loc-*.txt"
risk: medium
risk_reason: "Directory/filename semantics may differ across DI file scope; must verify with tests"

