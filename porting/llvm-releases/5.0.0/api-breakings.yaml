group: LegacyPassManager
files:
  - tools/Tracer/Tracer.cpp
changing:
  - old: "PassManager Passes;"
    new: "legacy::PassManager Passes;"
    reason: "PassManager moved to legacy:: namespace in LLVM 3.8+"
  - old: 'Passes.add(new DataLayout(M.get()));'
    new: "Remove; DataLayout is not a pass. Set via M->setDataLayout(DataLayout(...));"
    reason: "DataLayout-as-pass removed in LLVM 3.6+"
  - old: "Passes.add(createVerifierPass())"
    new: "Passes.add(createVerifierPass()) still works but createVerifierPass returns std::unique_ptr"
  - old: "Passes.add(createBitcodeWriterPass(RawOut))"
    new: "WriteBitcodeToFile(M, RawOut)"
    reason: "createBitcodeWriterPass removed in LLVM 4.0+; use WriteBitcodeToFile directly"

