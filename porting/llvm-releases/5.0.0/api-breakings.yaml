  - id: "distinct-metadata-nodes"
    category: "llvm-ir"
    changeType: "added"
    severity: "medium"
    summary: |-
      Metadata nodes can opt-out of uniquing using the 'distinct' keyword
    description: |-
      Metadata nodes can opt-out of uniquing, using the keyword distinct. Distinct nodes are still owned by the context, but are stored in a side table, and not uniqued. In LLVM 3.5, metadata nodes would drop uniquing if an operand changed to null during optimizations. This is no longer true. However, if an operand change causes a uniquing collision, they become distinct. Unlike LLVM 3.5, where serializing to assembly or bitcode would re-unique the nodes, they now remain distinct.
    affectedApi:
      - "distinct"
      - "MDNode"
      - "uniquing"
    versions: [3.6.2]
    originalIds: [distinct-metadata-nodes]
    notes: |-
      Self-referencing nodes are implicitly distinct.
    relevance: "unknown"
    status: "pending"

  - id: "metadata-cyclic-graphs-resolveCycles"
    category: "llvm-ir"
    changeType: "added"
    severity: "medium"
    summary: |-
      Cyclic metadata graphs require calling resolveCycles() to resolve nodes in the cycle
    description: |-
      During graph construction, if a metadata node transitively references a forward declaration, the node itself is considered 'unresolved' until the forward declaration resolves. An unresolved node can RAUW itself to support uniquing. Nodes automatically resolve once all their operands have resolved. However, cyclic graphs prevent the nodes from resolving. An API client that constructs a cyclic graph must call resolveCycles() to resolve nodes in the cycle. To save self-references from that burden, self-referencing nodes are implicitly distinct.
    affectedApi:
      - "resolveCycles()"
      - "MDNode"
      - "unresolved nodes"
      - "RAUW"
    versions: [3.6.2]
    originalIds: [metadata-cyclic-graphs-resolveCycles]
    relevance: "unknown"
    status: "pending"

