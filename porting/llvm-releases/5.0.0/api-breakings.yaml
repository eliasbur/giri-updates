    new: "ConstantDataArray::getString(Context, Ref)"
    reason: "Third parameter (unique) removed in LLVM 5.0"
  - old: "Function::setLinkage(GlobalValue::InternalLinkage)"
    new: "Function::setLinkage(GlobalValue::InternalLinkage)"
    reason: "Still the same in LLVM 5"
  - old: "CastInst::CreateZExtOrBitCast(V, Ty, Name, InsertPt)"
    new: "CastInst::CreateZExtOrBitCast(V, Ty, Name, InsertPt)"
