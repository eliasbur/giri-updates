group: PostDominanceFrontier
files:
  - include/Utility/PostDominanceFrontier.h
  - lib/Utility/PostDominatorFrontier.cpp
changes:
  - old: '#include "llvm/Analysis/DominanceFrontier.h"'
    new: "Removed; DominanceFrontier.h and DominanceFrontierBase removed in LLVM 3.8"
    reason: "DominanceFrontier infrastructure fully removed from LLVM"
  - old: '#include "llvm/Analysis/DominatorInternals.h"'
    new: "Removed entirely from LLVM 3.8+"
  - old: "struct PostDominanceFrontier : public DominanceFrontierBase"
    new: "struct PostDominanceFrontier : public FunctionPass (self-contained)"
    reason: "DominanceFrontierBase no longer exists; must implement from scratch"
    design_note: >
      Reimplement the standard dominance-frontier algorithm using PostDominatorTree.
      For each node N in the post-dominator tree:
      - DF_local(N) = {succ(BB) | BB is a successor of N->getBlock() in CFG
        and IDom(N) != PostDomTree->properlyDominates(N, succ)}
      More precisely: for each CFG predecessor P of BB where IDom(P) != N,
      insert P into frontier. Then propagate up: for each child C of N in
      the PDT, insert nodes from DF(C) that are not strictly dominated by N.
      The public surface (runOnFunction, getAnalysisUsage for PostDominatorTree)
      stays the same; only internals and the base class change.
  - old: "DomTreeNode::getIDom()"
    new: "DomTreeNodeBase::getIDom()" (still exists in PostDominatorTree nodes)
  - old: "DT.properlyDominates()"
    new: "PDT.dominates() or PDT.properlyDominates()" - verify availability in 5.0
  - old: "getRoots()"
    new: "PDT.getRoots() - still available"
  - old: "Frontiers[BB] member from base class"
    new: "std::map<BasicBlock *, SmallPtrSetImpl<BasicBlock *>> Frontiers; (owned directly)"
  - old: 'INITIALIZE_PASS_BEGIN(PostDominanceFrontier, "postdomfrontier", ...)'
    new: "Removed; use RegisterPass<PostDominanceFrontier> H(\"postdomfrontier\", ..., true, true);"
    reason: "INITIALIZE_PASS_BEGIN/END macros removed in LLVM 3.4+; RegisterPass handles registration"
  - old: "INITHALIZE_PASS_DEPENDENCY(PostDominatorTree)"
    new: "Move dependency to getAnalysisUsage: AU.addRequired<PostDominatorTree>()"
  - old: "const DominanceFrontier::DomSetType&"
    new: "const SmallPtrSetImpl<BasicBlock *>&"
    reason: "DomSetType from DominanceFrontier; replace with SmallPtrSetImpl"
verification:
  test: "test/UnitTests/test8, test9"
  check: "Control-dependence slices match ans-*.txt on branch/loop tests"
risk: high
risk_reason: "Requires from-scratch algorithm implementation; correctness proven only against test suite"

