# API changes required to port Giri from LLVM 3.4 to LLVM 5.0.0
# Grouped by Giri subsystem so agents can work on one group at a time.
#
# How to read:
#   - "old": the LLVM 3.4 API call / pattern as used in Giri
#   - "new": the LLVM 5.0 equivalent
#   - "reason": why the change is needed
#   - "design_note": if a design decision is required (not just a mechanical rename)
#
# Verification section describes how to check the change is correct.

---
group: BuildSystem
files:
  - utils/install_llvm.sh
  - utils/build.sh
  - Dockerfile
changes:
  - old: "./configure --with-llvmsrc=... --with-llvmobj=..."
    new: "CMake: cd build && cmake -DLLVM_DIR=$LLVM_HOME/lib/cmake/llvm .."
    reason: "LLVM 5 is CMake-only; autoconf/configure build system removed upstream since 3.5"
  - old: "make"
    new: "cmake --build ."
  - old: "sys/Configure.ac, autogen.sh, Makefile.llvm"
    new: "CMakeLists.txt driven by llvm_map_components_to_libnames() or find_library()"
  - old: "install_llvm.sh downloads source tarballs and builds from source"
    new: "install_llvm.sh downloads prebuilt tarball or source+cmake build"
    reason: "Prebuilt binaries are recommended for 5.0; source builds require CMake"
  - old: "Dockerfile based on ubuntu:14.04 with autoconf/libtool/automake"
    new: "Dockerfile based on ubuntu:16.04 with cmake/g++"

---
group: HeaderRenames
files:
  - lib/Giri/TracingNoGiri.cpp
  - lib/Giri/Giri.cpp
  - lib/Giri/TraceFile.cpp
  - include/Giri/Giri.h
  - include/Giri/TraceFile.h
  - include/Utility/BasicBlockNumbering.h
  - include/Utility/LoadStoreNumbering.h
  - include/Utility/SourceLineMapping.h
  - include/Utility/PostDominanceFrontier.h
  - include/Utility/Utils.h
  - tools/Tracer/Tracer.cpp
  - tools/PrintTrace/PrintTrace.cpp
  - lib/Utility/BasicBlockNumbering.cpp
  - lib/Utility/LoadStoreNumbering.cpp
  - lib/Utility/PostDominatorFrontier.cpp
  - lib/Utility/SourceLineMapping.cpp
changes:
  - old: "llvm/InstVisitor.h"
    new: "llvm/IR/InstVisitor.h"
    reason: "Moved in LLVM 3.5+ as part of IR/ subdirectory reorganization"
  - old: "llvm/Support/CallSite.h"
    new: "llvm/IR/CallSite.h"
    reason: "Moved in LLVM 3.7+; still present in 5.0 but in new location"
  - old: "llvm/Support/CFG.h"
    new: "llvm/IR/CFG.h"
    reason: "Moved in LLVM 3.7+"
  - old: "llvm/Analysis/Verifier.h"
    new: "llvm/IR/Verifier.h"
    reason: "Moved in LLVM 3.6+"
  - old: "llvm/PassManager.h"
    new: "llvm/IR/LegacyPassManager.h"
    reason: "Pass manager header renamed; legacy PM namespace in LLVM 5"
  - old: "llvm/Support/InstIterator.h"
    new: "llvm/IR/InstIterator.h"
    reason: "Moved in LLVM 3.5+"
  - old: "llvm/IR/DataLayout.h"
    new: "llvm/IR/DataLayout.h"
    reason: "Header location is the same but DataLayout is no longer a pass"
  - old: "llvm/Bitcode/ReaderWriter.h"
    new: "llvm/Bitcode/BitcodeReader.h (ParseBitcodeFile still present via wrapper)"
    reason: "Check availability; ParseBitcodeFile may still work in 5.0"
  - old: "llvm/IR/DerivedTypes.h"
    new: "Removed in LLVM 3.4+ (already a compat header); types are directly in llvm/IR/Type.h, llvm/IR/Instructions.h"
    reason: "DerivedTypes.h was deprecated and later removed; getVectorTy etc. moved to CastInst/CmpInst/IntrinsicInst"
  - old: "llvm/Transforms/Utils/BasicBlockUtils.h"
    new: "llvm/Transforms/Utils/BasicBlockUtils.h"
    reason: "Same path; verify appendToGlobalCtors signature"

