group: CallInstChanges
files:
  - lib/Giri/TracingNoGiri.cpp
  - lib/Giri/TraceFile.cpp
  - include/Utility/SourceLineMapping.h
  - include/Utility/Utils.h
changes:
  - old: "CallInst *CI; Function *CalledFunc = CI->getCalledFunction();"
    new: "CallInst *CI; Function *CalledFunc = CI->getCalledFunction();"
    reason: "Still available in LLVM 5 but deprecated; uses CallSite internally. Consider: CI->getCalledOperand()->getFunction()"
  - old: "CallSite CS(I)"
    new: "CallSite CS(I) still works in 5.0 (deprecated header warning)"
  - old: "CS.getArgument(index)"
    new: "CS.arg_begin()[index] or iterate CS.arg_operands()"
  - old: "CS.arg_size()"
    new: "CS.arg_size() still works"
  - old: "CI->getCalledValue()->stripPointerCasts()"
    new: "CI->getCalledOperand()->stripPointerCasts()"
    reason: "getCalledValue() deprecated in LLVM 5; use getCalledOperand()"
  - old: "isa<DbgInfoIntrinsic>(I)"
    new: "isa<DbgDeclareInst>(I) || isa<DbgValueIntrinsic>(I)"
    reason: "DbgInfoIntrinsic base class removed in LLVM 3.5+"
  - old: '#include "llvm/Support/CallSite.h"'
    new: '#include "llvm/IR/CallSite.h"'
    reason: "Header moved"

