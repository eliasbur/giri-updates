    relevance: "unknown"
    status: "pending"

  - id: "prefix-prologue-split"
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "high"
    summary: |-
      The semantics of the prefix attribute have been changed; former behavior renamed to prologue
    description: |-
      The semantics of the prefix attribute have been changed. Users that want the previous prefix semantics should instead use prologue. In this release the concept of prefix data has been redefined to be data which occurs immediately before the function entrypoint (i.e. the symbol address). Since prefix data now occurs before the function entrypoint, there is no need for the data to be valid code. The previous notion of prefix data now goes under the name 'prologue data' to emphasize its duality with the function epilogue. The intention here is to handle cases (1) code sanitization metadata and (2) function hot-patching with prologue data and case (3) language runtime metadata with prefix data.
    affectedApi:
      - "prefix"
      - "prologue"
      - "prefix attribute"
      - "prologue attribute"
    versions: [3.6.2]
    originalIds: [prefix-prologue-split]
    notes: |-
      Refactoring arose out of discussions with Reid Kleckner. Three usecases: (1) Code sanitization metadata, (2) Function hot-patching, (3) Language runtime metadata (e.g. GHC tables-next-to-code).
    relevance: "unknown"
    status: "pending"

