    description: "The IAS received a lot of GNU extensions and directives, as well as some specific pre-UAL instructions. Not all remaining directives will be implemented, as we made judgement calls on the need versus the complexity, and have chosen simplicity and future compatibility where hard decisions had to be made. The major difference is, as stated above, the IAS validates all inline ASM, not just for object emission, and that cause trouble with some uses of inline ASM as pre-processor magic. So, while the IAS is good enough to compile large projects (including most of the Linux kernel), there are a few things that we can't (and probably won't) do. For those cases, please use -fno-integrated-as in Clang."
