  # --- Major changes in 3.7.1 (C API ABI fix) ---

  - id: llvmbuildlandingpad-signature-restored
    category: "c-api"
    changeType: "renamed"
    severity: "high"
    summary: "LLVMBuildLandingPad C API signature restored to 3.6.2 form; 3.7.0 ABI incompatible with 3.7.1"
    description: "3.7.0 was released with an inadvertent change to the signature of the C API function: LLVMBuildLandingPad, which made the C API incompatible with prior releases. This has been corrected in LLVM 3.7.1. As a result of this change, 3.7.0 is not ABI compatible with 3.7.1."
    affectedApi:
      - "LLVMBuildLandingPad"
    notes: "3.6.2 and prior: LLVMBuildLandingPad(LLVMBuilderRef, LLVMTypeRef, LLVMValueRef, unsigned, const char*). 3.7.0 removed LLVMValueRef param. 3.7.1 restores 3.6.2 signature."
    relevance: "unknown"
    status: "pending"

