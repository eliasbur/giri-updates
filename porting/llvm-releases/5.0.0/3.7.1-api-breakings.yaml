  # --- Changes to the JIT APIs ---

  - id: orc-jit-api-added
    category: "general"
    changeType: "added"
    severity: "medium"
    summary: "New C++ JIT API called On Request Compilation (ORC) added"
    description: "Added a new C++ JIT API called On Request Compilation, or ORC. ORC is a new JIT API inspired by MCJIT but designed to be more testable, and easier to extend with new features. A key new feature already in tree is lazy, function-at-a-time compilation for X86. Also included is a reimplementation of MCJIT's API and behavior (OrcMCJITReplacement). MCJIT itself remains in tree, and continues to be the default JIT ExecutionEngine, though new users are encouraged to try ORC out for their projects."
    affectedApi:
      - "ORC"
