  - id: opaque-pointer-transition
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "high"
    summary: "LLVM IR transitioning toward opaque (typeless) pointers; APIs modified for explicit types"
    description: "LLVM IR and APIs are in a period of transition to aid in the removal of pointer types (the end goal being that pointers are typeless/opaque - void*, if you will). Some APIs and IR constructs have been modified to take explicit types that are currently checked to match the target type of their pre-existing pointer type operands. Further changes are still needed, but the more you can avoid using PointerType::getPointeeType, the easier the migration will be."
    affectedApi:
      - "PointerType::getPointeeType"
      - "PointerType"
    notes: "End goal is opaque/void* pointers; transitional phase started in 3.7."
