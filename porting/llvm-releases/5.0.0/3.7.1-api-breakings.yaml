  - id: bpf-backend-added
    category: "general"
    changeType: "added"
    severity: "low"
    summary: "BPF backend target for extended Berkely Packet Filter added"
    description: "LLVM received a backend for the extended Berkely Packet Filter instruction set that can be dynamically loaded into the Linux kernel via the bpf(2) syscall. Support for BPF has been present in the kernel for some time, but starting from 3.18 has been extended with such features as: 64-bit registers, 8 additional registers, conditional backwards jumps, call instruction, shift instructions, map (hash table, array, etc.), 1-8 byte load/store from stack, and more. The BPF target is now available by default, and options exist in both Clang (-target bpf) or llc (-march=bpf) to pick eBPF as a backend."
    affectedApi:
      - "BPF target"
      - "eBPF"
      - "bpf(2)"
