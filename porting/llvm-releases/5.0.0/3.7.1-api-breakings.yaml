  - id: datalayout-required
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "DataLayout is no longer optional; API changed from pointer to reference"
    description: "The DataLayout is no longer optional. All the IR level optimizations expects it to be present and the API has been changed to use a reference instead of a pointer to make it explicit. The Module owns the datalayout and it has to match the one attached to the TargetMachine for generating code. In 3.6, a pass was inserted in the pipeline to make the DataLayout accessible: MyPassManager->add(new DataLayoutPass(MyTargetMachine->getDataLayout())); In 3.7, you don't need a pass, you set the DataLayout on the Module: MyModule->setDataLayout(MyTargetMachine->createDataLayout());"
    affectedApi:
      - "DataLayout"
      - "DataLayoutPass"
      - "Module::setDataLayout"
      - "TargetMachine::createDataLayout"
      - "TargetMachine::getDataLayout"
    notes: "LLVMGetTargetMachineData deprecated in favor of Module-owned DataLayout."
    relevance: "unknown"
    status: "pending"

