  - id: metadata-typeless
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "high"
    summary: "Metadata is typeless; old IR syntax with metadata type wrappers inside nodes is obsolete"
    description: "The following old IR: metadata !{i32 %v}, metadata !{i32* @global}, metadata !{metadata !\"string\"}, metadata !{metadata !{metadata !1, metadata !\"string\"}}, and metadata !{metadata !1, metadata !2, metadata !3, metadata !\"some string\"} should now be written as: i32 %v, i32* @global, !{!\"string\"}, !{!{!1, !\"string\"}}, and !{!1, !2, !3, !\"some string\"}."
    affectedApi:
      - "metadata type"
      - "MDNode"
      - "Metadata"
      - "!{...}"
    notes: "Old metadata !{type value} syntax replaced with simpler !{value} form, stripping metadata type wrappers inside nodes."
    relevance: "unknown"
    status: "pending"

  - id: distinct-metadata-nodes
    category: "llvm-ir"
    changeType: "added"
    severity: "medium"
    summary: "Metadata nodes can opt-out of uniquing using the 'distinct' keyword"
    description: "Metadata nodes can opt-out of uniquing, using the keyword distinct. Distinct nodes are still owned by the context, but are stored in a side table, and not uniqued. In LLVM 3.5, metadata nodes would drop uniquing if an operand changed to null during optimizations. This is no longer true. However, if an operand change causes a uniquing collision, they become distinct. Unlike LLVM 3.5, where serializing to assembly or bitcode would re-unique the nodes, they now remain distinct."
    affectedApi:
      - "distinct"
      - "MDNode"
      - "uniquing"
    notes: "Self-referencing nodes are implicitly distinct."
    relevance: "unknown"
    status: "pending"

  - id: metadata-cyclic-graphs-resolveCycles
    category: "llvm-ir"
    changeType: "added"
    severity: "medium"
    summary: "Cyclic metadata graphs require calling resolveCycles() to resolve nodes in the cycle"
    description: "During graph construction, if a metadata node transitively references a forward declaration, the node itself is considered 'unresolved' until the forward declaration resolves. An unresolved node can RAUW itself to support uniquing. Nodes automatically resolve once all their operands have resolved. However, cyclic graphs prevent the nodes from resolving. An API client that constructs a cyclic graph must call resolveCycles() to resolve nodes in the cycle. To save self-references from that burden, self-referencing nodes are implicitly distinct."
    affectedApi:
      - "resolveCycles()"
      - "MDNode"
      - "unresolved nodes"
      - "RAUW"
    notes: ""
    relevance: "unknown"
    status: "pending"

  - id: mdlocation-new-metadata
    category: "llvm-ir"
    changeType: "added"
    severity: "high"
    summary: "New first-class metadata construct MDLocation (aka DebugLoc aka DILocation) for !dbg attachments"
    description: "There's a new first-class metadata construct called MDLocation (to be followed in subsequent releases by others). It's used for the locations referenced by !dbg metadata attachments. For example, if an old !dbg attachment looked like metadata !{i32 10, i32 3, metadata !2, metadata !1), the new attachment looks like !MDLocation(line: 10, column: 3, scope: !2, inlinedAt: !1). The fields are named, can be reordered, and have sane defaults if left out (although scope: is required)."
    affectedApi:
      - "MDLocation"
      - "DebugLoc"
      - "DILocation"
      - "!dbg"
      - "!MDLocation"
    notes: "Fields are named (line, column, scope, inlinedAt), can be reordered, and have sane defaults. scope: is required."
    relevance: "unknown"
    status: "pending"

