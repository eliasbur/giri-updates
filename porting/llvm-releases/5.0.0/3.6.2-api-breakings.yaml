  # --- Changes to the LLVM IR (prefix data, metadata, alias syntax, comdat syntax) ---

  - id: prefix-prologue-split
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "high"
    summary: "The semantics of the prefix attribute have been changed; former behavior renamed to prologue"
    description: "The semantics of the prefix attribute have been changed. Users that want the previous prefix semantics should instead use prologue. In this release the concept of prefix data has been redefined to be data which occurs immediately before the function entrypoint (i.e. the symbol address). Since prefix data now occurs before the function entrypoint, there is no need for the data to be valid code. The previous notion of prefix data now goes under the name 'prologue data' to emphasize its duality with the function epilogue. The intention here is to handle cases (1) code sanitization metadata and (2) function hot-patching with prologue data and case (3) language runtime metadata with prefix data."
    affectedApi:
      - "prefix"
      - "prologue"
      - "prefix attribute"
      - "prologue attribute"
    notes: "Refactoring arose out of discussions with Reid Kleckner. Three usecases: (1) Code sanitization metadata, (2) Function hot-patching, (3) Language runtime metadata (e.g. GHC tables-next-to-code)."
    relevance: "unknown"
    status: "pending"

  - id: metadata-not-a-value
    category: "llvm-ir"
    changeType: "removed"
    severity: "high"
    summary: "Metadata nodes and strings are no longer values—they have no use-lists, no type, cannot RAUW, and cannot be function-local"
    description: "Metadata nodes (!{...}) and strings (!\"...\") are no longer values. They have no use-lists, no type, cannot RAUW, and cannot be function-local."
    affectedApi:
      - "Metadata"
      - "Value"
      - "MDNode"
      - "MDString"
      - "RAUW"
      - "use-lists"
    notes: "LLVM intrinsics can reference metadata using the metadata type. Function-local metadata is limited to direct arguments to LLVM intrinsics."
    relevance: "unknown"
    status: "pending"

  - id: metadata-bridges-value-metadata
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "high"
    summary: "New bridges between Value and Metadata: intrinsics use metadata type, metadata nodes can reference constant values"
    description: "LLVM intrinsics can reference metadata using the metadata type, and metadata nodes can reference constant values. Function-local metadata is limited to direct arguments to LLVM intrinsics."
    affectedApi:
