  - id: "ilist-iterator-pointer-conversion-removed"
    category: "general"
    changeType: "removed"
    severity: "high"
    summary: "ilist_iterator<T> no longer has implicit conversions to/from T*"
    description: "ilist_iterator<T> no longer has implicit conversions to and from T*, since ilist_iterator<T> may be pointing at the sentinel (which is usually not of type T at all). To convert from an iterator I to a pointer, use &*I; to convert from a pointer P to an iterator, use P->getIterator(). Alternatively, explicit conversions via static_cast<T>(U) are still available."
    affectedApi:
      - "ilist_iterator"
      - "ilist_iterator::operator T*"
      - "ilist_iterator::operator="
      - "getIterator"
    notes: "This is a compile-time breaking change affecting any code relying on implicit iterator/pointer conversion."
    relevance: "unknown"
    status: "pending"

  - id: "ilist-node-next-prev-compile-time-fail"
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "ilist_node<T>::getNextNode()/getPrevNode() now fail at compile time when parent list inaccessible"
    description: "ilist_node<T>::getNextNode() and ilist_node<T>::getPrevNode() now fail at compile time when the node cannot access its parent list. Previously, when the sentinel was an ilist_half_node<T>, this API could return the sentinel instead of nullptr. Frustrated callers should be updated to use iplist<T>::getNextNode(T*) instead. Alternatively, if the node N is guaranteed not to be the last in the list, it is safe to call &*++N->getIterator() directly."
    affectedApi:
      - "ilist_node::getNextNode"
      - "ilist_node::getPrevNode"
      - "ilist_half_node"
      - "iplist::getNextNode"
      - "getIterator"
    notes: ""
    relevance: "unknown"
    status: "pending"

