    targetName: "systemz"
    changeType: "added"
    severity: "low"
    summary: "Support for the arch13 architecture has been added (-march=arch13); -mtune=arch13 enables arch13 scheduling without new instructions; builtins for new vector instructions enabled with -mzvector (__VEC__ predefined to 10303); alignment hints auto-generated on vector load/store; various code-gen improvements."
    description: "Support for the arch13 architecture has been added. When using the -march=arch13 option, the compiler will generate code making use of new instructions introduced with the vector enhancement facility 2 and the miscellaneous instruction extension facility 2. The -mtune=arch13 option enables arch13 specific instruction scheduling and tuning without making use of new instructions. Builtins for the new vector instructions have been added and can be enabled with the -mzvector option. Support for these builtins is indicated by the compiler predefining the __VEC__ macro to the value 10303. The compiler now supports and automatically generates alignment hints on vector load and store instructions."
