  # --- Other Changes ---

  - id: other-lit-target-feature-syntax
    category: "general"
    changeType: "behavior-change"
    severity: "low"
    summary: "lit no longer supports substrings of the default target triple as feature names in UNSUPPORTED:/XFAIL: directives; replaced by the target=<triple> feature with regex matching (e.g. UNSUPPORTED: arm -> UNSUPPORTED: target=arm{{.*}})"
    description: "lit no longer supports using substrings of the default target triple as feature names in UNSUPPORTED: and XFAIL: directives. These have been replaced by the target=<triple> feature, and tests can use regex matching to achieve the same effect. For example, UNSUPPORTED: arm would now be UNSUPPORTED: target=arm{{.*}} and XFAIL: windows would now be XFAIL: target={{.*}}-windows{{.*}}."
    affectedApi:
      - "lit"
      - "UNSUPPORTED"
      - "XFAIL"
    notes: |-
        LLVM's own test-suite tooling change; Giri's test suite is a Makefile-driven suite (test/Makefile.common), not a lit suite. No interaction.
    relevance: "irrelevant"
    status: "pending"

  - id: other-llvm-native-tool-dir-cmake-variable
    category: "general"
    changeType: "added"
    severity: "low"
    summary: "When cross-compiling LLVM (or building with LLVM_OPTIMIZED_TABLEGEN), LLVM_NATIVE_TOOL_DIR points the build to prebuilt host tools in one CMake variable instead of LLVM_TABLEGEN / CLANG_TABLEGEN / LLDB_TABLEGEN etc."
    description: "When cross compiling LLVM (or building with LLVM_OPTIMIZED_TABLEGEN), it is now possible to point the build to prebuilt versions of all the host tools with one CMake variable, LLVM_NATIVE_TOOL_DIR, instead of having to point out each individual tool with variables such as LLVM_TABLEGEN, CLANG_TABLEGEN, LLDB_TABLEGEN etc."
    affectedApi:
      - "LLVM_NATIVE_TOOL_DIR"
    notes: |-
