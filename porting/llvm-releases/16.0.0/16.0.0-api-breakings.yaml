    summary: "DWARF v4/GDB: llc now uses DW_AT_data_bit_offset (DWARF v4) instead of DW_AT_bit_offset/DW_AT_data_member_location (DWARF v2) when emitting DWARF v4 and tuning for GDB; GDB < 8.0 users can use -dwarf-version=3"
