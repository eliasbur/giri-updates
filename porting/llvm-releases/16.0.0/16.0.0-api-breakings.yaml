  # --- Update on required toolchains to build LLVM ---

  - id: build-toolchain-minimum-versions-soft
    category: "building"
    changeType: "behavior-change"
    severity: "high"
    summary: LLVM 16 is built with C++17 by default; the previous soft toolchain requirements are now hard (GCC >= 7.1, Clang >= 5.0, Apple Clang >= 10.0, Visual Studio 2019 >= 16.7, no longer suppressible); CMake >= 3.20.0 required (soft in 16.x, hard from 17.x)
    description: |-
        LLVM is now built with C++17 by default. This means C++17 can be used in the code base. The previous "soft" toolchain requirements have now been changed to "hard". This means that the the following versions are now required to build LLVM and there is no way to suppress this error: GCC >= 7.1, Clang >= 5.0, Apple Clang >= 10.0, Visual Studio 2019 >= 16.7. With LLVM 16.x we will raise the version requirement of CMake used to build LLVM. The new requirements are as follows: CMake >= 3.20.0. In LLVM 16.x this requirement will be "soft", there will only be a diagnostic. With the release of LLVM 17.x this requirement will be hard and LLVM developers can start using CMake 3.20.0 features, making it impossible to build with older versions of CMake.
    affectedApi:
      - "C++17"
      - "LLVM_TEMPORARILY_ALLOW_OLD_TOOLCHAIN (no longer effective)"
      - "GCC >= 7.1"
      - "Clang >= 5.0"
      - "Apple Clang >= 10.0"
      - "Visual Studio 2019 >= 16.7"
      - "CMake >= 3.20.0"
    notes: |-
        PORT-CRITICAL for the 16.0.0 port: the 16.0.0 prebuilt's headers (e.g. llvm/ADT/bit.h using std::is_integral_v) require C++17, and the prebuilt's CMake package exports no LLVM_OPTIMIZED_CXX_FLAGS / no C++ standard, so the root CMakeLists.txt sets CMAKE_CXX_STANDARD 17 + CMAKE_CXX_STANDARD_REQUIRED ON (commit bd4d5c2) - without it the build compiles with the host gcc 7.5 gnu++14 default and fails. The 16.0.0 prebuilt is itself C++17 (llvm-config --cxxflags = -std=c++17). The CMake >= 3.20.0 floor applies to building LLVM from source; the port's pinned CMake 3.31.12 satisfies it and the prebuilt's LLVMConfigVersion.cmake sets no CMake floor, so the project's 3.5 floor stays the binding constraint. Same id as the 15.0.0 entry (the section continued across releases); merged in place in the consolidated file (versions [15.0.0, 16.0.0]).
    relevance: "affected"
    status: "addressed"

  # --- Changes to the LLVM IR ---

  - id: llvm-ir-memory-attributes-replaced
    category: "llvm-ir"
    changeType: "removed"
    severity: "medium"
    summary: "The readnone/readonly/writeonly/argmemonly/inaccessiblememonly/inaccessiblemem_or_argmemonly function attributes are replaced by a single memory(...) attribute"
    description: |-
        The readnone, readonly, writeonly, argmemonly, inaccessiblememonly and inaccessiblemem_or_argmemonly function attributes have been replaced by a single memory(...) attribute. The old attributes may be mapped to the new one as follows: readnone -> memory(none); readonly -> memory(read); writeonly -> memory(write); argmemonly -> memory(argmem: readwrite); argmemonly readonly -> memory(argmem: read); argmemonly writeonly -> memory(argmem: write); inaccessiblememonly -> memory(inaccessiblemem: readwrite); inaccessiblememonly readonly -> memory(inaccessiblemem: read); inaccessiblememonly writeonly -> memory(inaccessiblemem: write); inaccessiblemem_or_argmemonly -> memory(argmem: readwrite, inaccessiblemem: readwrite); inaccessiblemem_or_argmemonly readonly -> memory(argmem: read, inaccessiblemem: read); inaccessiblemem_or_argmemonly writeonly -> memory(argmem: write, inaccessiblemem: write).
    affectedApi:
      - "readnone"
      - "readonly"
      - "writeonly"
      - "argmemonly"
      - "inaccessiblememonly"
      - "inaccessiblemem_or_argmemonly"
      - "memory(...)"
    notes: |-
        No source interaction: Giri never sets or queries the removed memory-effect attributes (verified: no readnone/readonly/writeonly/argmemonly/inaccessiblemem* usage in lib/, include/, runtime/, tools/). The only attribute the port sets is Attribute::NoUnwind (lib/Giri/TracingNoGiri.cpp:121), which is unaffected and compiles cleanly against the 16.0.0 headers (verified: a minimal TU using Attribute::NoUnwind compiles; the old ReadNone enum is gone from llvm/IR/Attributes.h in 16.0.0, replaced by the MemoryEffects-based API, Attributes.h:1237 AttrBuilder::addMemoryAttr).
    relevance: "unlikely"
    status: "resolved"

