  # --- Changes to the LLVM tools ---

  - id: tools-llvm-readobj-json-elf-output-style
    category: "general"
    changeType: "behavior-change"
    severity: "low"
    summary: "llvm-readobj --elf-output-style=JSON no longer prefixes each JSON object with the file name (consumers of that JSON output must update parsers)"
    description: "llvm-readobj --elf-output-style=JSON no longer prefixes each JSON object with the file name. Previously, each object file's output looked like \"main.o\":{\"FileSummary\":{\"File\":\"main.o\"},...} but is now {\"FileSummary\":{\"File\":\"main.o\"},...}. This allows each JSON object to be parsed in the same way, since each object no longer has a unique key. Tools that consume llvm-readobj's JSON output should update their parsers accordingly."
    affectedApi:
      - "llvm-readobj"
      - "--elf-output-style=JSON"
    notes: |-
        Tool output-format change; the Giri pipeline never invokes llvm-readobj (its stages are clang, llvm-link, opt, llc, clang++, and the Giri tracer/prtrace binaries). No interaction.
    relevance: "irrelevant"
    status: "pending"

