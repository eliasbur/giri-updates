  # --- Changes to the C API ---

  - id: llvmcapi-constant-expression-creators-removed
    category: "c-api"
    changeType: "removed"
    severity: "medium"
    summary: "C-API constant-expression creators removed: LLVMConstFNeg; use the LLVMBuildXYZ APIs instead (they constant-fold when possible)"
    description: "The following functions for creating constant expressions have been removed, because the underlying constant expressions are no longer supported. Instead, an instruction should be created using the LLVMBuildXYZ APIs, which will constant fold the operands if possible and create an instruction otherwise: LLVMConstFNeg."
    affectedApi:
      - "LLVMConstFNeg"
    notes: |-
        Continuation of the 15.0.0 C-API constant-expression removal (LLVMConstExtractValue/InsertValue/UDiv/... incl. Exact variants); 16.0.0 removes LLVMConstFNeg with the fneg constant expression. Giri uses the C++ API exclusively (no C-API usage in the tree); no source interaction.
    relevance: "irrelevant"
    status: "pending"

  - id: llvmcapi-opaque-pointer-removals-1600
    category: "c-api"
    changeType: "removed"
    severity: "medium"
    summary: "The opaque-pointer-incompatible C-APIs deprecated in 15.0.0 are now REMOVED: LLVMBuildLoad/Call/Invoke/GEP/InBoundsGEP/StructGEP/PtrDiff/ConstGEP/ConstInBoundsGEP/AddAlias (only the *2 forms remain)"
    description: |-
        The following deprecated functions have been removed, because they are incompatible with opaque pointers. Use the new functions accepting a separate function/element type instead: LLVMBuildLoad -> LLVMBuildLoad2, LLVMBuildCall -> LLVMBuildCall2, LLVMBuildInvoke -> LLVMBuildInvoke2, LLVMBuildGEP -> LLVMBuildGEP2, LLVMBuildInBoundsGEP -> LLVMBuildInBoundsGEP2, LLVMBuildStructGEP -> LLVMBuildStructGEP2, LLVMBuildPtrDiff -> LLVMBuildPtrDiff2, LLVMConstGEP -> LLVMConstGEP2, LLVMConstInBoundsGEP -> LLVMConstInBoundsGEP2, LLVMAddAlias -> LLVMAddAlias2.
    affectedApi:
      - "LLVMBuildLoad"
      - "LLVMBuildCall"
      - "LLVMBuildInvoke"
      - "LLVMBuildGEP"
      - "LLVMBuildInBoundsGEP"
      - "LLVMBuildStructGEP"
      - "LLVMBuildPtrDiff"
      - "LLVMConstGEP"
      - "LLVMConstInBoundsGEP"
      - "LLVMAddAlias"
    notes: |-
        Follow-up to llvmcapi-opaque-pointer-migration-deprecations-1500 (15.0.0 deprecated this set; 16.0.0 removes it). Giri uses the C++ API exclusively (no C-API usage in the tree), so the removed C-API set has no source interaction.
    relevance: "irrelevant"
    status: "pending"

