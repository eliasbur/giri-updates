# consider, across the 9.0.0-16.0.0 release-note window, plus the header-level C++
# API breaks and the toolchain/build-system changes that are NOT cited in the LLVM
# release notes (the 14.0.0 port-critical C++ fixes, the 15.0.0 build-system and
# Clang-driver fixes, and the 16.0.0 C++17 / None / shim-gate fixes).
#
# Schema follows the template at porting/llvm-releases/.release-notes-changes-template.yaml
# with two added fields per entry (matching the 8.0.0 consolidated file):
#   - versions: array of version strings where this change appears
#   - originalIds: array of the original id values from each per-version source file
#
# The 7 per-version files (9.0.0-15.0.0) are raw release-note extractions (relevance triaged
# in place). This file is their deduped union: cross-version same-id groups are merged with a
# versions[] list (powerpc-power10-support; the mips/avr/webassembly/hexagon redacted markers;
# the general top-level change-list marker; the ARM Armv9-A and Armv8.1-M PACBTI-M bullets),
# and the 13.0.0+14.0.0 legacy-pass-manager deprecation re-statement is merged into one entry.
# The 14.0.0 port-critical header-level C++ breaks (getOrInsertFunction/FunctionCallee,
# CallSite->CallBase, sys::fs F_None->OF_None, and the DEBUG_TYPE/STATISTIC call-site
# interaction) are originalIds: [] because they are not release-note items; their per-test
# root causes are also in porting/TestAudit/llvm-14.0.0-legacypm/ and AGENTS.md.
# The 15.0.0 port-critical changes (prebuilt-toolchain build system, the GLIBCXX link shim,
# the DataLayout self-assignment surfaced by the 15.0.0 verifier, and the two Clang 15 driver
# defaults) are likewise originalIds: []; their root causes are in porting/TestAudit/llvm-15.0.0/
# and the branch AGENTS.md. The 16.0.0 port-critical changes (C++17 default + a prebuilt CMake
# config exporting no C++ standard, the ArrayRef None -> {} default-argument removal, and the
# configure-time GLIBCXX shim gate) are likewise originalIds: []; their root causes are in
# porting/TestAudit/llvm-16.0.0/ and the branch AGENTS.md.
#
# 16.0.0 extension (2026-08-31): the 16.0.0 release-notes block (appended below the 15.0.0
# block) adds 9 new-id entries (IR: memory attributes, target extension types, atomicrmw
# uinc/udec_wrap, the flt.rounds rename; C API: the opaque-pointer + fneg removals; tools:
# the llvm-readobj JSON change; Hexagon: the V71/V73 support entry - a NEW id because the
# 16.0.0 Hexagon section is no longer redacted; plus the two port-critical header/build
# breaks - the ArrayRef None default argument and the GLIBCXX shim gate - as originalIds:
# []). The 8 same-id 16.0.0 changes (re-stated or re-redacted in the 16.0.0 release
# notes) were merged in place into their pre-existing entries: versions[]/originalIds[] extended,
# with notes-16.0.0 enrichment on the 3 port-relevant ones (build-toolchain floor - the
# 16.0.0 C++17 default is port-critical; the constant-expression removal - 16.0.0 adds fneg;
# the opaque-pointer default - re-verification note only: 16.0.0 does not re-state the
# opaque-pointer default, but the 16.0.0 port re-verified that -Xclang -no-opaque-pointers
# is honored + load-bearing on the 16.0.0 ubuntu-18.04 prebuilt, so its versions[] is
# unchanged).

