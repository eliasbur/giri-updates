  # --- LLVM 15.0.0 release notes (port/llvm-15.0.0; 39 entries; 7 same-id 14.0.0 entries
  #     extended in place with versions:[..,15.0.0] above) ---

  # --- Building LLVM (15.0.0) ---

  - id: "build-toolchain-minimum-versions-soft"
    category: "building"
    changeType: "behavior-change"
    severity: "medium"
    summary: "LLVM 15.x raises the minimum build-toolchain versions (GCC >= 7.1, Clang >= 5.0, Apple Clang >= 9.3, Visual Studio 2019 >= 16.7); soft in 15.x, hard in 16.x (C++17)"
    description: |-
        With LLVM 15.x we will raise the version requirements of the toolchain used to build LLVM. The new requirements are as follows: GCC >= 7.1, Clang >= 5.0, Apple Clang >= 9.3, Visual Studio 2019 >= 16.7. In LLVM 15.x these requirements will be "soft" requirements and the version check can be skipped by passing -DLLVM_TEMPORARILY_ALLOW_OLD_TOOLCHAIN=ON to CMake. With the release of LLVM 16.x these requirements will be hard and LLVM developers can start using C++17 features, making it impossible to build with older versions of these toolchains.
    affectedApi: ["LLVM_TEMPORARILY_ALLOW_OLD_TOOLCHAIN", "GCC >= 7.1", "Clang >= 5.0", "Apple Clang >= 9.3", "Visual Studio 2019 >= 16.7"]
    versions: [15.0.0, 16.0.0]
    originalIds: [build-toolchain-minimum-versions-soft, build-toolchain-minimum-versions-soft]
    notes: |-
        Applies to building LLVM from source. The port builds Giri against the prebuilt x86_64 15.0.0 toolchain, which is itself built with -std=c++14 (verified: `llvm-config --cxxflags`), so the source-build toolchain floor does not apply and C++17 is NOT required for the 15.0.0 port. The 16.x hard-C++17 note is the trigger for a future source-build migration and is recorded here for that reason.
    notes-16.0.0: |-
        RESOLVED FOR THE 16.0.0 PORT: 16.0.0 is the first C++17-default release (llvm-config --cxxflags = -std=c++17) and the hard toolchain floor (GCC >= 7.1, Clang >= 5.0, Apple Clang >= 10.0, VS2019 >= 16.7, no longer suppressible) is in force. The CMake >= 3.20.0 requirement is soft (diagnostic-only) in 16.x and hard from 17.x; the port's pinned CMake 3.31.12 satisfies it and the project's 3.5 floor stays the binding constraint (the prebuilt's LLVMConfigVersion.cmake sets no CMake floor). The C++17 default is the port-critical consequence: the prebuilt's CMake package exports no LLVM_OPTIMIZED_CXX_FLAGS / no C++ standard, so the root CMakeLists.txt sets CMAKE_CXX_STANDARD 17 + CMAKE_CXX_STANDARD_REQUIRED ON (commit bd4d5c2) or the build compiles with the host gcc 7.5 gnu++14 default and fails on the 16.0.0 headers (std::is_integral_v in llvm/ADT/bit.h).
    relevance: "affected"
    status: "addressed"

  - id: "building-cmake-build-type-now-required"
    category: "building"
    changeType: "behavior-change"
    severity: "medium"
    summary: "Omitting CMAKE_BUILD_TYPE when using a single-configuration generator is now an error"
    description: |-
        Omitting CMAKE_BUILD_TYPE when using a single configuration generator is now an error. You now have to pass -DCMAKE_BUILD_TYPE=<type> in order to configure LLVM. This is done to help new users of LLVM select the correct type: since building LLVM in Debug mode is very resource intensive, we want to make sure that new users make the choice that lines up with their usage.
    affectedApi: ["CMAKE_BUILD_TYPE"]
    versions: [15.0.0]
    originalIds: [building-cmake-build-type-now-required]
    notes: |-
        Applies to configuring LLVM from source with a single-config generator. The port builds Giri against the prebuilt 15.0.0 toolchain (not LLVM), and the Giri build script (utils/build.sh) already passes -DCMAKE_BUILD_TYPE=Release, so the project configures cleanly. The prebuilt 15.0.0 CMake package imposes no explicit cmake_minimum_required (normal for a prebuilt install), so the Giri CMakeLists.txt floor bump 3.4.3 -> 3.5 (commit 0500b26) is a forward-compatibility choice (CMake 4.x drops support for CMakeLists < 3.5), not a direct LLVM-15 mandate.
    relevance: "irrelevant"
    status: "pending"

  # --- LLVM IR (15.0.0) ---

  - id: "llvm-ir-opaque-pointers-default"
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "high"
    summary: "LLVM now uses opaque pointers by default; different pointer types (i8*, i32*, void()**) are represented as a single ptr type"
    description: |-
        LLVM now uses opaque pointers. This means that different pointer types like i8*, i32* or void()** are now represented as a single ptr type. See the linked document for migration instructions.
    affectedApi: ["opaque pointers", "ptr type", "typed pointer types", "clang -opaque-pointers"]
    versions: [15.0.0]
    originalIds: [llvm-ir-opaque-pointers-default]
    notes: |-
        BREAKS the reference harness (not the pass logic): from LLVM 15 clang emits IR with opaque pointers by default, whereas 14.0.0 (and the 3.4 reference the goldens were built with) emits typed pointers. Opaque IR changes the program structure the backward slice traverses, so the kmeans slice drifted from the golden. Fixed in the harness (test/Makefile.common) by adding -Xclang -no-opaque-pointers to the compile line to restore typed-pointer emit, so the numbered IR matches the 3.4 reference (commit 31e36fe); pass logic is unchanged and the full 22/22 suite passes. The 15.0.0 clang driver does not expose -opaque-pointers as a driver flag, so the cc1 flag is passed through -Xclang.
    notes-16.0.0: |-
        RE-VERIFIED FOR THE 16.0.0 PORT (2026-08-31): on the 16.0.0 ubuntu-18.04 prebuilt the harness's -Xclang -no-opaque-pointers passthrough flag is HONORED (not inert, as a pre-port probe had claimed): with it the `clang -S -emit-llvm` IR is typed (i32*, i32**); without it clang 16 emits opaque ptr. The flag is therefore load-bearing and stays in test/Makefile.common unchanged; no harness edit was needed for 16.0.0 (git diff 63b02e2..HEAD -- test/ is empty) and the 22/22 seq suite + 22/22 standalone tracer pass with typed IR.
    relevance: "affected"
    status: "addressed"

