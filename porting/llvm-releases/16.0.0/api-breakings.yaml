  - id: "module-getorinsertfunction-returns-functioncallee"
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "Module::getOrInsertFunction now returns FunctionCallee instead of Constant*"
    description: |-
        In LLVM 9.0.0 (D57315 / r352827) Module::getOrInsertFunction was changed to return FunctionCallee (a (Function*, Constant*) pair) instead of the previous Constant*/Value* (FunctionCallee carried no implicit conversion to Function* in 9.0.0-13.0.0). FunctionCallee is a header-level C++ API change and is not listed in the 9.0.0 release notes.
    affectedApi: ["Module::getOrInsertFunction", "FunctionCallee", "FunctionCallee::getCallee()"]
    versions: [9.0.0]
    originalIds: []
    notes: |-
        BREAKS Giri (header-level, not release-note-cited): the two getOrInsertFunction call sites (include/Utility/Utils.h:148,240 and lib/Giri/TracingNoGiri.cpp:65) must now call .getCallee() and cast to Function. Fixed in commit 306d34f (Phase 1) via cast<Function>(M.getOrInsertFunction(...).getCallee()). Behavior preserved; 22/22 suite pass.
    relevance: "affected"
    status: "addressed"

  - id: "callsite-getcalledvalue-removed-callbase"
    category: "llvm-ir"
