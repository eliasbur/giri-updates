        Distribution/glibc mismatch, not a C++ API break: the rhel-8.4 prebuilt references a GLIBCXX symbol focal's libstdc++ lacks. The shim is link-only (defines the one missing symbol); no behavior change. 22/22 suite pass.
    relevance: "affected"
    status: "addressed"

  - id: "tracer-datalayout-self-assignment-removed"
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "tools/Tracer/Tracer.cpp M->setDataLayout(M->getDataLayout()) is a self-assignment that corrupts the DataLayout; 15.0.0's verifier added a ParamMaxAlignment check that aborts on it"
    description: |-
        DataLayout::operator= is hand-written (llvm/IR/DataLayout.h:213, byte-identical in 14.0.0 and 15.0.0): it calls clear() and then copies member-by-member from the (now-cleared) source. The line M->setDataLayout(M->getDataLayout()) is a *self-assignment* (getDataLayout returns const DataLayout& and setDataLayout takes const DataLayout&), so operator= clears the layout and copies it from itself, destroying the parsed alignment/pointer tables (measured: ABI(i32) 4 -> 65536). This is a pre-existing latent defect inherited from the 14.0.0 head: the opt-driven suite never executes this line and does not verify by default. LLVM 15.0.0 added a verifier check (Verifier.cpp: ParamMaxAlignment = 1 << 14, "Incorrect alignment of ... to called function!") that rejects a call argument whose ABI alignment exceeds 2^14; the corrupted layout reports absurd alignments, so the trailing VerifierPass now aborts the standalone tracer on every pointer-argument call. Removing the line fixes the root cause (no corruption to verify away); the module's DataLayout comes from the parsed bitcode, so no re-setting is needed.
    affectedApi: ["DataLayout::operator=", "Module::setDataLayout", "Module::getDataLayout", "VerifierPass", "ParamMaxAlignment"]
    versions: [15.0.0]
    originalIds: []
    notes: |-
        Root-cause fix (commit d2c294e): remove the self-assignment line in tools/Tracer/Tracer.cpp; it is a no-op under 14.0.0 (the suite path) but aborts under 15.0.0 (the standalone tracer path). Verified against the 15.0.0 and 14.0.0 DataLayout.h (operator= does clear()+member-copy in both). The removed line is behaviorally a no-op, so this is byte-identical to the 14.0.0 path. 22/22 opt suite + 22/22 standalone tracer pass.
    relevance: "affected"
    status: "addressed"

  - id: "clang-15-driver-defaults-pie-and-implicit-fn-decl"
    category: "building"
    changeType: "behavior-change"
    severity: "medium"
    summary: "Clang 15 defaults: -pie at the link and -Wimplicit-function-declaration as an error (14.0.0: non-PIE, warning); both break the inherited harness"
    description: |-
        From Clang 15 the driver (1) links position-independent executables by default on Linux (clang links -pie and assembles .s with -mrelocation-model pic), and (2) makes -Wimplicit-function-declaration a hard error by default (14.0.0 warned). These are Clang driver defaults (noted in the 15.0.0 *Clang* release notes under "LLVM 15.0.0 Release Notes: Building Clang", not the LLVM release notes), so originalIds: []. -no-pie restores the non-PIE link; -Wno-error=implicit-function-declaration downgrades the error to the 14.0.0 warning. (The opaque-pointer emit change that also affects the harness is the release-note item llvm-ir-opaque-pointers-default and is tracked there, not here.)
    affectedApi: ["-pie", "-no-pie", "-Wimplicit-function-declaration", "-Wno-error=implicit-function-declaration", "Clang 15 driver"]
    versions: [15.0.0]
    originalIds: []
    notes: |-
        Fixed in the harness (test/Makefile.common + test/HelloWorld/Makefile, commit 31e36fe): -no-pie at the traced-exe link (14.0.0/3.4 linked non-PIE; llc -O0 emits static-model asm whose absolute .rodata R_X86_64_32S is rejected by a PIE link; the .s and its numbering are untouched, invariant 1 preserved, breaks the 7 tests whose instrumented .s carries the relocation) and -Wno-error=implicit-function-declaration in CFLAGS (test20's even.c calls is_odd before its definition; verified on the 14.0.0 image clang-14 compiles the same pattern with a warning, rc=0). Behavior preserved; 22/22 suite pass.
    relevance: "affected"
    status: "addressed"

