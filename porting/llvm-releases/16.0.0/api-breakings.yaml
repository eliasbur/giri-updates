        16.0.0 adds fneg to the removed constant-expression variants (LLVMConstFNeg is also removed from the C API - see llvmcapi-opaque-pointer-removals-1600). No Giri source interaction: no ConstantExpr::getFNeg / fneg usage in the tree (verified); the ConstantExpr uses in TracingNoGiri.cpp / Utils.h are getZExtOrBitCast, which is unaffected.
