  - id: "llvmcapi-opaque-pointer-removals-1600"
    category: "c-api"
    changeType: "removed"
    severity: "medium"
    summary: "The opaque-pointer-incompatible C-APIs deprecated in 15.0.0 are now REMOVED: LLVMBuildLoad/Call/Invoke/GEP/InBoundsGEP/StructGEP/PtrDiff/ConstGEP/ConstInBoundsGEP/AddAlias (only the *2 forms remain); LLVMConstFNeg removed with the fneg constant expression"
    description: |-
        The following deprecated functions have been removed, because they are incompatible with opaque pointers. Use the new functions accepting a separate function/element type instead: LLVMBuildLoad -> LLVMBuildLoad2, LLVMBuildCall -> LLVMBuildCall2, LLVMBuildInvoke -> LLVMBuildInvoke2, LLVMBuildGEP -> LLVMBuildGEP2, LLVMBuildInBoundsGEP -> LLVMBuildInBoundsGEP2, LLVMBuildStructGEP -> LLVMBuildStructGEP2, LLVMBuildPtrDiff -> LLVMBuildPtrDiff2, LLVMConstGEP -> LLVMConstGEP2, LLVMConstInBoundsGEP -> LLVMConstInBoundsGEP2, LLVMAddAlias -> LLVMAddAlias2. The following functions for creating constant expressions have been removed, because the underlying constant expressions are no longer supported. Instead, an instruction should be created using the LLVMBuildXYZ APIs, which will constant fold the operands if possible and create an instruction otherwise: LLVMConstFNeg.
    affectedApi: ["LLVMBuildLoad", "LLVMBuildCall", "LLVMBuildInvoke", "LLVMBuildGEP", "LLVMBuildInBoundsGEP", "LLVMBuildStructGEP", "LLVMBuildPtrDiff", "LLVMConstGEP", "LLVMConstInBoundsGEP", "LLVMAddAlias", "LLVMConstFNeg"]
