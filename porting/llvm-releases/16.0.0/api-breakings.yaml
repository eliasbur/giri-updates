  # --- Changes to the LLVM IR (16.0.0) ---

  - id: "llvm-ir-memory-attributes-replaced"
    category: "llvm-ir"
    changeType: "removed"
    severity: "medium"
    summary: "The readnone/readonly/writeonly/argmemonly/inaccessiblememonly/inaccessiblemem_or_argmemonly function attributes are replaced by a single memory(...) attribute"
    description: |-
        The readnone, readonly, writeonly, argmemonly, inaccessiblememonly and inaccessiblemem_or_argmemonly function attributes have been replaced by a single memory(...) attribute. The old attributes may be mapped to the new one as follows: readnone -> memory(none); readonly -> memory(read); writeonly -> memory(write); argmemonly -> memory(argmem: readwrite); argmemonly readonly -> memory(argmem: read); argmemonly writeonly -> memory(argmem: write); inaccessiblememonly -> memory(inaccessiblemem: readwrite); inaccessiblememonly readonly -> memory(inaccessiblemem: read); inaccessiblememonly writeonly -> memory(inaccessiblemem: write); inaccessiblemem_or_argmemonly -> memory(argmem: readwrite, inaccessiblemem: readwrite); inaccessiblemem_or_argmemonly readonly -> memory(argmem: read, inaccessiblemem: read); inaccessiblemem_or_argmemonly writeonly -> memory(argmem: write, inaccessiblemem: write).
    affectedApi: ["readnone", "readonly", "writeonly", "argmemonly", "inaccessiblememonly", "inaccessiblemem_or_argmemonly", "memory(...)", "Attribute::NoUnwind"]
    versions: [16.0.0]
    originalIds: [llvm-ir-memory-attributes-replaced]
    notes: |-
        No source interaction: Giri never sets or queries the removed memory-effect attributes (verified: no readnone/readonly/writeonly/argmemonly/inaccessiblemem* usage in lib/, include/, runtime/, tools/). The only attribute the port sets is Attribute::NoUnwind (lib/Giri/TracingNoGiri.cpp:121), which is unaffected and compiles cleanly against the 16.0.0 headers (verified: a minimal TU using Attribute::NoUnwind compiles; the old ReadNone enum is gone from llvm/IR/Attributes.h in 16.0.0, replaced by the MemoryEffects-based API, Attributes.h:1237 AttrBuilder::addMemoryAttr).
    relevance: "unlikely"
    status: "resolved"

