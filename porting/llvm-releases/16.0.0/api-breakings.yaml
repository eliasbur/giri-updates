    severity: "high"
    summary: "CallSite class and getCalledValue() removed; use CallBase::getCalledOperand()"
    description: |-
        In LLVM 11.0.0 the CallSite C++ class and its getCalledValue() method were removed from the IR API (getCalledValue still present in 10.0.0 InstrTypes.h, absent in 11.0.0+). The replacement is to cast the instruction to const CallBase* and use CallBase::getCalledOperand(), arg_size(), and getArgOperand(i). This is a header-level C++ API change, not a release-note item (the 11.0.0 notes’ "callsite" entry is an unrelated IR attribute).
    affectedApi: ["CallSite", "CallBase", "getCalledValue", "getCalledOperand", "arg_size", "getArgOperand"]
    versions: [11.0.0]
    originalIds: []
    notes: |-
        BREAKS Giri (header-level, not release-note-cited): lib/Giri/TraceFile.cpp:678 now casts the instruction to const CallBase* and uses CS->arg_size()/CS->getArgOperand(i); getCalledValue()->getCalledOperand() replacement in lib/Utility/SourceLineMapping.cpp and lib/Giri/TracingNoGiri.cpp. Fixed in commit 306d34f (Phase 1). Behavior preserved; 22/22 suite pass. (CallSite lives in llvm/IR/InstrTypes.h; the 11.0.0 callsite-attribute-vfabi-variant-added entry is a different, unrelated IR attribute.)
    relevance: "affected"
