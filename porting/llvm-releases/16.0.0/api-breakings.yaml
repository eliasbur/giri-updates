  # --- Header-level port-critical breaks (16.0.0; NOT cited in the release notes; originalIds: []) ---

  - id: "adt-16-0-0-arrayref-none-default-arg-removed"
    category: "general"
    changeType: "removed"
    severity: "high"
    summary: "16.0.0 headers no longer make None convertible to ArrayRef: ArrayRef.h dropped its transitive #include of ADT/None.h and the implicit ArrayRef(NoneType) {}; the 3.4-vintage getOrInsertF default argument ArrayRef<Type *> Args = None fails to compile ('None' was not declared)"
    description: |-
        In 15.0.0, llvm/ADT/ArrayRef.h includes llvm/ADT/None.h (which defines const NoneType None = NoneType::None) and provides the implicit ArrayRef(NoneType) {} constructor (ArrayRef.h:70-71), so a default argument spelled ArrayRef<Type *> Args = None resolves. In 16.0.0 the include chain no longer brings None into scope at the call site and the NoneType constructor is gone (None.h / NoneType still exist, but None no longer converts to ArrayRef), so the 3.4-vintage getOrInsertF default argument in lib/Giri/TracingNoGiri.cpp (ArrayRef<Type *> Args = None, line 61) fails with "'None' was not declared".
    affectedApi: ["None", "NoneType", "llvm/ADT/None.h", "ArrayRef(NoneType) constructor", "getOrInsertF default argument"]
    versions: [16.0.0]
    originalIds: []
    notes: |-
        Root-cause fix (commit bd4d5c2): the default argument is now = {} (an empty ArrayRef), which is behavior-identical for the sole default-using call site (giriCtor, a zero-arg function; all other call sites pass explicit argument lists). Verified: no other None default-argument usage in the tree; the build is green and the 22/22 suite passes.
    relevance: "affected"
    status: "addressed"

  - id: "tracer-16-0-0-glibcxx-shim-gate"
    category: "building"
    changeType: "behavior-change"
    severity: "medium"
    summary: "The 16.0.0 ubuntu-18.04 prebuilt's static LLVM libs reference std::__throw_bad_array_new_length 0x (the 15.0.0 rhel-8.4 prebuilt's libLLVMAnalysis.a/libLLVMBitWriter.a did), and 18.04's libstdc++ lacks the _GLIBCXX_NODISCARD macro the shim TU uses - the 15.0.0 hard-wired shim would fail to compile, so it is now gated on a configure-time nm probe of the actual static libs"
    description: |-
        The 15.0.0 port hard-wired tools/Tracer/llvm_std_shim.cpp into the tracer target because the 15.0.0 rhel-8.4 prebuilt's static libs reference std::__throw_bad_array_new_length (GLIBCXX 3.4.29) and the ubuntu:20.04 host libstdc++ (3.4.28) lacked it. For the 16.0.0 ubuntu-18.04 prebuilt that premise is doubly false: (1) none of the llvm-config --libfiles all static libs references the symbol (verified: nm -C over every lib, 0 references; libLLVM-16.so likewise), so the tracer link needs no back-fill, and (2) ubuntu:18.04's libstdc++ (3.4.25) also lacks the out-of-line helper function (it exports the bad_array_new_length CLASS but not __throw_bad_array_new_length, and no 16.0.0 object needs it) while lacking the _GLIBCXX_NODISCARD macro (GCC 10+) the shim TU uses - so compiling the shim on 16.0.0/18.04 is a hard error.
    affectedApi: ["std::__throw_bad_array_new_length", "_ZSt28__throw_bad_array_new_lengthv", "_GLIBCXX_NODISCARD", "llvm_std_shim.cpp", "tracer target"]
    versions: [16.0.0]
