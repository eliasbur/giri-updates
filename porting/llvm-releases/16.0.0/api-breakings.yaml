        Constant-expression IR removal (parse/emit side). Giri only *creates* cast constant expressions (ConstantExpr::getZExtOrBitCast in include/Utility/Utils.h and lib/Giri/TracingNoGiri.cpp) and reads IR via the C++ API; it never constructs or parses the removed arithmetic const-expr forms. No source interaction.
