  - id: "domtree-undef-debug-type-statistic-call-site"
    category: "general"
    changeType: "behavior-change"
    severity: "high"
    summary: "GenericDomTreeConstruction.h #undefs DEBUG_TYPE; the 14.0.0 STATISTIC macro references DEBUG_TYPE at the call site"
    description: |-
        llvm/Support/GenericDomTreeConstruction.h has done #undef DEBUG_TYPE since 9.0.0, but llvm/IR/Dominators.h only started including it in 14.0.0 (present in 14.0.0 Dominators.h, absent in 13.0.0). The 14.0.0 STATISTIC macro (llvm/ADT/Statistic.h:167) expands to static llvm::Statistic VARNAME = {DEBUG_TYPE, #VARNAME, DESC}, so it references DEBUG_TYPE at the call site. Giri’s pass TUs pull in Dominators.h transitively (include/Giri/Giri.h includes llvm/Analysis/PostDominators.h), so by the time the STATISTIC(...) lines are reached DEBUG_TYPE has been #undef’d and compilation breaks. 14.0.0 Debug.h also provides no bare DEBUG(X) macro (only DEBUG_WITH_TYPE/LLVM_DEBUG), so the per-file DEBUG_TYPE and a DEBUG(X)->DEBUG_WITH_TYPE(DEBUG_TYPE,X) shim are both required after the includes. Header-level interaction, not a release-note item.
    affectedApi: ["DEBUG_TYPE", "STATISTIC", "GenericDomTreeConstruction.h", "Dominators.h", "Debug.h"]
    versions: [14.0.0]
    originalIds: []
    notes: |-
        BREAKS Giri (header-level, not release-note-cited): the STATISTIC lines fail in the five STATISTIC-using TUs (lib/Giri/Giri.cpp, lib/Giri/TraceFile.cpp, lib/Giri/TracingNoGiri.cpp, lib/Utility/CountSrcLines.cpp, lib/Utility/SourceLineMapping.cpp) because Dominators.h (pulled in transitively, e.g. via include/Giri/Giri.h -> llvm/Analysis/PostDominators.h) #undefs DEBUG_TYPE. Fixed in commit 74b870f by moving `#define DEBUG_TYPE` to after the includes in those files; the DEBUG(X)->DEBUG_WITH_TYPE(DEBUG_TYPE,X) shim is the 8.0.0-port carry-over (commit 16236bd) and stays as-is. 74b870f also dropped the f0f0f9c STATISTIC->STATISTIC_WITH_TYPE shim, whose premise (14.0.0 requires an explicit debug-type argument) was wrong: the 14.0.0 STATISTIC macro picks up the file’s DEBUG_TYPE at the call site, so the #undef was the only real issue. Behavior preserved; 22/22 suite pass.
    relevance: "affected"
    status: "addressed"  # --- LLVM 15.0.0 port-critical changes (NOT cited in the LLVM release notes; originalIds: []) ---

  - id: "building-15-0-0-prebuilt-toolchain"
    category: "building"
    changeType: "behavior-change"
    severity: "medium"
    summary: "15.0.0 toolchain wiring: ubuntu:20.04 + CMake 3.31.12 + prebuilt 15.0.0 rhel-8.4; CMake floor 3.5; find_package(LLVM 15.0); CMAKE_BUILD_TYPE now required"
    description: |-
        The 15.0.0 port builds Giri against the prebuilt x86_64 15.0.0 (rhel-8.4) LLVM/Clang toolchain installed on ubuntu:20.04 (the rhel-8.4 prebuilt needs glibc >= 2.28; focal's glibc 2.31 qualifies), with CMake pinned to 3.31.12 in the Dockerfile. Two 15.0.0 build-system facts are in the release notes but are port-irrelevant (the prebuilt is already built): the 15.x toolchain floor is soft (GCC >= 7.1 / Clang >= 5.0 / Apple Clang >= 9.3 / VS2019 >= 16.7, skippable via -DLLVM_TEMPORARILY_ALLOW_OLD_TOOLCHAIN=ON) and becomes hard in 16.x once C++17 is adopted (verified: the prebuilt's llvm-config --cxxflags is -std=c++14, so 15.0.0 does NOT require C++17); and omitting CMAKE_BUILD_TYPE with a single-config generator is now an error (Giri's utils/build.sh already passes -DCMAKE_BUILD_TYPE=Release). The CMake floor bump 3.4.3 -> 3.5 and find_package(LLVM 15.0 REQUIRED CONFIG) (commit 0500b26) are Giri-side forward-compatibility choices (the prebuilt 15.0.0 CMake package imposes no explicit cmake_minimum_required), not a direct LLVM-15 mandate.
    affectedApi: ["cmake_minimum_required", "find_package(LLVM 15.0)", "CMAKE_BUILD_TYPE", "ubuntu:20.04", "prebuilt 15.0.0 rhel-8.4"]
    versions: [15.0.0]
    originalIds: []
    notes: |-
        Toolchain wiring, not a C++ API break: all Giri C++ compiled against 15.0.0 with zero 14->15 API breaks (the port adds no C++ fixes; see the 14.0.0 header-level C++ breaks above). DEBIAN_FRONTEND=noninteractive in the Dockerfile avoids the unattended tzdata/tzdata-legacy prompt during apt on focal. Behavior preserved; 22/22 suite pass.
    relevance: "affected"
    status: "addressed"

  - id: "tracing-giri-rtgiri-glibcxx-throw-bad-array-new-length"
    category: "building"
    changeType: "added"
    severity: "medium"
    summary: "GLIBCXX 3.4.29 std::__throw_bad_array_new_length missing from focal libstdc++ 6.0.28; a 4-line link shim TU defines it for the statically-linked tracer"
    description: |-
        The 15.0.0 rhel-8.4 prebuilt was built with a newer GCC than ubuntu:20.04's gcc 9.4 (libstdc++ 6.0.28 = GLIBCXX 3.4.28 max). Two prebuilt static libs (libLLVMAnalysis.a, libLLVMBitWriter.a) reference std::__throw_bad_array_new_length() (symbol _ZSt28__throw_bad_array_new_lengthv, GLIBCXX 3.4.29, first defined out-of-line in GCC 10). Only the tracer statically links the LLVM libs (the .so pass-plugin targets use --allow-shlib-undefined and the prebuilt opt/clang are shared + lazily bound), so the missing symbol is a link-time error only for the tracer. A 4-line shim TU (tools/Tracer/llvm_std_shim.cpp, commit 6f7954d) defining the single symbol in namespace std satisfies the linker.
    affectedApi: ["std::__throw_bad_array_new_length", "_ZSt28__throw_bad_array_new_lengthv", "GLIBCXX_3.4.29"]
    versions: [15.0.0]
