  # --- Changes to the JIT APIs ---

  - id: orc-legacy-prefix-deprecated
    category: "general"
    changeType: "deprecated"
    severity: "high"
    summary: "Existing non-concurrent ORC layer classes deprecated and renamed with a 'Legacy' prefix; removal planned for LLVM 9"
    description: |-
      The ORC (On Request Compilation) JIT APIs have been updated to support concurrent compilation. The existing (non-concurrent) ORC layer classes and related APIs are deprecated, have been renamed with a "Legacy" prefix (e.g. LegacyIRCompileLayer). The deprecated clasess will be removed in LLVM 9.
    affectedApi:
      - "ORC"
      - "LegacyIRCompileLayer"
    notes: "ORC/JIT APIs a static pass never links against; recorded because the notes dedicate a section to this change"
    relevance: "irrelevant"
    status: "pending"

  - id: lljit-added
    category: "general"
    changeType: "added"
    severity: "low"
    summary: "New LLJIT JIT stack added using the concurrent ORC APIs; lli updated to use LLJIT"
    description: |-
      An example JIT stack using the concurrent ORC APIs, called LLJIT, has been added (see include/llvm/ExecutionEngine/Orc/LLJIT.h). The lli tool has been updated to use LLJIT. MCJIT and ExecutionEngine continue to be supported, though ORC should be preferred for new projects.
    affectedApi:
