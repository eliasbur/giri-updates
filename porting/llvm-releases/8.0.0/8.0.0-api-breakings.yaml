  # --- Minimum Required Compiler Version ---

  - id: min-compiler-version-bump-clang-gcc
    category: "general"
    changeType: "default-change"
    severity: "medium"
    summary: "Building LLVM will soon require more recent toolchains (Clang 3.5, Apple Clang 6.0, GCC 5.1, Visual Studio 2017); new LLVM_TEMPORARILY_ALLOW_OLD_TOOLCHAIN CMake soft-error opt-out"
    description: |-
      As discussed on the mailing list, building LLVM will soon require more recent toolchains as follows: Clang 3.5, Apple Clang 6.0, GCC 5.1, Visual Studio 2017. A new CMake check when configuring LLVM provides a soft-error if your toolchain will become unsupported soon. You can opt out of the soft-error by setting the LLVM_TEMPORARILY_ALLOW_OLD_TOOLCHAIN CMake variable to ON.
    affectedApi:
      - "Clang 3.5"
      - "Apple Clang 6.0"
      - "GCC 5.1"
      - "Visual Studio 2017"
      - "LLVM_TEMPORARILY_ALLOW_OLD_TOOLCHAIN"
    notes: "Directly informed the base-image choice: the port image is ubuntu:18.04 with gcc 7.5, satisfying the GCC >= 5.1 requirement (Dockerfile comment records the escalation from 14.04 gcc 4.8 for this reason; 16.04 had to be skipped as it is no longer served by old-releases.ubuntu.com). No opt-out variable needed."
    relevance: "affected"
    status: "addressed"

