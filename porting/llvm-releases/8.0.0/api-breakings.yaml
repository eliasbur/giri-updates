  - id: "smallvector-tiny-size-shrank"
    category: "general"
    changeType: "behavior-change"
    severity: "medium"
    summary: |-
      SmallVector<T, 0> shrank to sizeof(void*) + sizeof(unsigned) * 2; maximum capacity now restricted to UINT32_MAX
    description: |-
      SmallVector<T, 0> shrank from sizeof(void*) * 4 + sizeof(T) to sizeof(void*) + sizeof(unsigned) * 2, smaller than std::vector<T> on 64-bit platforms. The maximum capacity is now restricted to UINT32_MAX. Since SmallVector doesn't have the exception-safety pessimizations some implementations saddle std::vector with and is better at using realloc, it's now a better choice even on the heap (although when TinyPtrVector works, that's even smaller).
    affectedApi: ["SmallVector", "TinyPtrVector"]
    versions: [7.0.0]
    originalIds: [smallvector-tiny-size-shrank]
    notes: |-
      Giri declares SmallVector<Value*, 0> (include/Utility/Utils.h:241) — the exact affected variant — but the change is size/capacity-only; the clean LLVM 8.0.0 build and 21/21 test pass confirm no behavioral impact.
    relevance: "unlikely"
    status: "pending"

