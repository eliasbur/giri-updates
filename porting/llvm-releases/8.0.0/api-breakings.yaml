# API changes required to port Giri from LLVM 3.4 to LLVM 8.0.0
# Grouped by Giri subsystem so agents can work on one group at a time.
#
# How to read:
#   - "old": the LLVM 3.4 API call / pattern as used in Giri
#   - "new": the LLVM 8.0 equivalent
#   - "reason": why the change is needed
#   - "design_note": if a design decision is required (not just a mechanical rename)
#
# Verification section describes how to check the change is correct.

---
group: BuildSystem
files:
  - CMakeLists.txt
  - utils/install_llvm.sh
  - utils/build.sh
  - Dockerfile
  - test/Makefile.common
  - test/HelloWorld/Makefile
changes:
  - old: "Autoconf/Makefile build (configure.ac, Makefile.llvm.rules)"
    new: "CMake with find_package(LLVM 8.0 REQUIRED CONFIG)"
    reason: "LLVM 8 is CMake-only; autoconf/Make build removed upstream"
    note: "utils/build.sh must use CMake 3.10-compatible syntax (no -S/-B)"
  - old: "make"
    new: "cmake --build build"
  - old: "llvm-config"
    new: "$LLVM_HOME/lib/cmake/llvm" for CMake
    reason: "LLVM 8 cmake config provides compiler flags; llvm-config is secondary"
  - old: "ARCHIVE_LIBRARY / BYTECODE_LIBRARY in Makefiles"
    new: "CMake add_library / add_llvm_loadable_module"
  - old: "GIRI_LIB_DIR points to build/<Mode>/lib"
    new: "GIRI_LIB_DIR points to build/lib (flat layout)"

---
group: MechanicalRenames
files:
  - include/Giri/Giri.h
  - lib/Giri/Giri.cpp
  - lib/Giri/TracingNoGiri.cpp
  - tools/Tracer/Tracer.cpp
changes:
  - old: "llvm/Analysis/Dominators.h"
    new: "llvm/IR/Dominators.h + llvm/Analysis/PostDominators.h"
    reason: "Header reorganization in LLVM 8"
  - old: "llvm/Analysis/Verifier.h"
    new: "llvm/IR/Verifier.h"
  - old: "llvm/InstVisitor.h"
    new: "llvm/IR/InstVisitor.h"
  - old: "llvm/Support/InstIterator.h"
    new: "llvm/IR/InstIterator.h"
  - old: "llvm/Support/CFG.h"
    new: "llvm/IR/CFG.h"
  - old: "llvm/PassManager.h; PassManager"
    new: "llvm/IR/LegacyPassManager.h; legacy::PassManager"
  - old: "llvm/Support/CallSite.h"
    new: "llvm/IR/CallSite.h (deprecated but present in 8.0)"
  - old: "OwningPtr<MemoryBuffer>; error_code = MemoryBuffer::getFileOrSTDIN(...)"
    new: "std::unique_ptr<MemoryBuffer>; ErrorOr<std::unique_ptr<MemoryBuffer>>"
    reason: "OwningPtr removed; MemoryBuffer API switched to ErrorOr"
  - old: "llvm/Bitcode/ReaderWriter.h"
    new: "Check if still exists; may need llvm/Bitcode/BitcodeReader.h + BitcodeWriter.h"
    reason: "ReaderWriter.h was a compatibility header"

---
group: DataLayoutAsPass
files:
  - include/Giri/Giri.h
  - lib/Giri/TracingNoGiri.cpp
  - tools/Tracer/Tracer.cpp
changes:
  - old: "AU.addRequired<DataLayout>()"
    new: "Remove; DataLayout is not a pass in LLVM 8"
    reason: "DataLayout-as-pass removed; use Module::getDataLayout() instead"
  - old: "getAnalysis<DataLayout>()"
    new: "F.getParent()->getDataLayout()"
    reason: "DataLayout is a Module member, not an analysis pass"
  - old: "Passes.add(new DataLayout(M.get()))"
    new: "Remove this line entirely"
  - old: "const DataLayout *TD;"
    new: "const DataLayout &DL = *F.getParent()->getDataLayout()"
    reason: "TL-> call sites may need adjustment (pointer -> ref/value)"

---
group: BasicBlockNumbering
files:
  - lib/Utility/BasicBlockNumbering.cpp
  - include/Utility/BasicBlockNumbering.h
  - lib/Utility/LoadStoreNumbering.cpp
  - include/Utility/LoadStoreNumbering.h
changes:
  - old: "MDNode::getWhenValsUnresolved(Context, values, false)"
    new: "Per-instruction metadata with ConstantAsMetadata"
    reason: "Metadata/Value split in LLVM 3.6+; getWhenValsUnresolved removed entirely"
    design_note: >
      Stop storing BasicBlock* in MDNode operands. Instead, store numeric ID directly
      on the block's first instruction via Instruction::setMetadata("bbid", MDNode).
      Recover BB via instr->getParent(). Similarly for LoadStoreNumbering: store
      metadata on the instruction itself.
  - old: "MDNode operands are Value* (e.g., BasicBlock* directly)"
    new: "MDNode operands are Metadata* (ConstantAsMetadata::get(ConstantInt::get(...)))"
    reason: "LLVM 3.6 MDNode::get takes ArrayRef<Metadata*>, not ArrayRef<Value*>"
  - old: "BasicBlock::iterator returned from functions used as raw pointer"
    new: "Dereference: &*iterator"
    reason: "LLVM 8 separates iterators from raw pointers; skipAllocas() returns iterator"
  - old: "dyn_cast<MDNode>(MD->getOperand(index)) with Value* casts"
    new: "dyn_cast<ConstantAsMetadata>(MD->getOperand(index))->getValue()"
    reason: "Read side must match new operand encoding"
verification:
  test: "test/UnitTests/test1"
  check: "opt -load libdgutility.so -bbnum -dump-bbid=true reproduces old IDs"
risk: medium
risk_reason: "Must preserve ID determinism exactly; silent corruption if iteration order changes"

---
group: SourceLineMapping
files:
  - lib/Utility/SourceLineMapping.cpp
  - lib/Giri/Giri.cpp
changes:
  - old: 'MDNode *N = I->getMetadata("dbg"); DILocation l(N)'
    new: "const DebugLoc &DL = I->getDebugLoc(); if (DL) { const DILocation *loc = DL.getDILocation(); ... }"
    reason: "DILocation constructor from MDNode removed; DebugLoc is the API"
  - old: "l.getLineNumber()"
    new: "loc->getLine()"
  - old: "l.getDirectory()"
    new: "loc->getScope()->getFile()->getDirectory()"
    reason: "Directory lives on DIFile, not DILocation"
  - old: "l.getFilename()"
    new: "loc->getScope()->getFile()->getFilename()"
  - old: "sys::fs::F_Append"
    new: "sys::fs::FA_Write / openOutputFile"
    reason: "sys::fs file opening API changed"
  - old: "getPassName() returns const char*"
    new: "getPassName() returns StringRef"
verification:
  test: "test/UnitTests/test10"
  check: "criterion-loc resolution matches ans-loc-*.txt"
risk: medium
risk_reason: "getDirectory() semantics need explicit verification against LLVM 8 DIScope/DIFile"

---
group: PostDominanceFrontier
files:
  - include/Utility/PostDominanceFrontier.h
  - lib/Utility/PostDominatorFrontier.cpp
changes:
  - old: "Class PostDominanceFrontier : public DominanceFrontierBase"
    new: "Reimplement from PostDominatorTree directly"
    reason: "DominanceFrontierBase and DominatorInternals.h removed in LLVM 8"
    design_note: >
      Implement the standard dominance-frontier algorithm: for each node in the
      PostDominatorTree, frontier members are successors not strictly post-dominated
      by the node, propagated up the post-dominator tree. The public surface
      (getAnalysisUsage, findExecForcers interface) can stay the same; only internals change.
  - old: "PostDominatorTree::ID"
    new: "Remove; PostDominatorTree is no longer a legacy pass with static ID"
  - old: "llvm/Analysis/DominatorInternals.h"
    new: "Removed in LLVM 8 — do not include"
verification:
  test: "test/UnitTests/test8, test9"
  check: "Control-dependence slices match ans-*.txt on branch/loop tests"
risk: high
risk_reason: "May require from-scratch algorithm implementation; correctness must be proven against test suite"

---
group: Miscellaneous
files:
  - lib/Giri/TraceFile.cpp
  - lib/Giri/TracingNoGiri.cpp
  - lib/Utility/SourceLineMapping.cpp
changes:
  - old: "sys::fs::F_Append"
    new: "sys::fs::FA_Write"
    reason: "File open flags renamed in LLVM 8"
  - old: "sys::fs::F_Create"
    new: "sys::fs::FA_Create"