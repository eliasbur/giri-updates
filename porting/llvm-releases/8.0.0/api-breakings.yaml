  - id: "fast-math-flags-reassoc-afn"
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "medium"
    summary: |-
      FMF updates: new 'reassoc' and 'afn' fast-math flags; 'fast' no longer implies all flags
    description: |-
      The fast-math-flags (FMF) have been updated. Previously, the 'fast' flag indicated that floating-point reassociation was allowed and all other flags were set too. The 'fast' flag still exists, but there is a new flag called 'reassoc' to indicate specifically that reassociation is allowed. A new bit called 'afn' was also added to selectively allow approximations for common mathlib functions like square-root. The new flags provide more flexibility to enable/disable specific floating-point optimizations. Making the optimizer respond appropriately to these flags is an ongoing effort.
    affectedApi: ["FastMathFlags", "reassoc", "afn", "fast"]
    versions: [6.0.0]
    originalIds: [fast-math-flags-reassoc-afn]
    notes: |-
      FMF semantics change affects only IR with fast-math flags; Giri test programs and passes set none, and 21/21 pass against 3.4 goldens.
    relevance: "unlikely"
    status: "pending"

  - id: "float-cast-overflow-attribute"
    category: "general"
    changeType: "added"
    severity: "low"
    summary: |-
      Improved floating-point cast folding; new strict-float-cast-overflow function attribute to opt out of overflow-folding behavior
    description: |-
      Optimization of floating-point casts is improved. This may cause surprising results for code that is relying on the undefined behavior of overflowing casts. The optimization can be disabled by specifying a function attribute: "strict-float-cast-overflow"="false". This attribute may be created by the clang option -fno-strict-float-cast-overflow. Code sanitizers can be used to detect affected patterns. The clang option for detecting this problem alone is -fsanitize=float-cast-overflow.
    affectedApi:
      - "strict-float-cast-overflow"
      - "-fno-strict-float-cast-overflow"
      - "-fsanitize=float-cast-overflow"
    versions: [7.0.0]
    originalIds: [float-cast-overflow-attribute]
    notes: |-
      New opt-out attribute for improved float-cast folding; Giri sets no fast-math/strict-cast flags and all 21 suite tests pass against the 3.4 goldens, so no codegen drift materialized.
    relevance: "unlikely"
    status: "pending"

