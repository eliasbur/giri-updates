  # --- Changes to the LLVM IR ---

  - id: callsite-attribute-vfabi-variant-added
    category: "llvm-ir"
    changeType: "added"
    severity: "low"
    summary: "The callsite attribute vector-function-abi-variant has been added to describe the mapping between scalar functions and vector functions (VFDatabase API); the loop vectorizer now relies on VFDatabase instead of TargetLibraryInfo"
    description: |-
      The callsite attribute vector-function-abi-variant has been added to describe the mapping between scalar functions and vector functions, to enable vectorization of call sites. The information provided by the attribute is interfaced via the API provided by the VFDatabase class. When scanning through the set of vector functions associated with a scalar call, the loop vectorizer now relies on VFDatabase, instead of TargetLibraryInfo.
    affectedApi:
      - "vector-function-abi-variant"
      - "VFDatabase"
    notes: |-
      This is an IR *callsite attribute* feature, not the CallSite C++ class API;
      no interaction with Giri (which manipulates CallBase directly).
    relevance: "irrelevant"
    status: "pending"

  - id: dereferenceable-no-alignment-implication
    category: "llvm-ir"
    changeType: "behavior-change"
    severity: "medium"
    summary: "dereferenceable attributes and metadata on pointers no longer imply anything about the alignment of the pointer in question; frontends may need to generate explicit align attributes/metadata to preserve optimizations"
    description: |-
      dereferenceable attributes and metadata on pointers no longer imply anything about the alignment of the pointer in question. Previously, some optimizations would make assumptions based on the type of the pointer. This behavior was undocumented. To preserve optimizations, frontends may need to be updated to generate appropriate align attributes and metadata.
    affectedApi:
      - "dereferenceable"
      - "align attribute"
    notes: ""
    relevance: "unlikely"
    status: "pending"

