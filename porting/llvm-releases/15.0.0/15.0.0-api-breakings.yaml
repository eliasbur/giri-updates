  - id: llvmcapi-constant-expression-creators-removed
    category: "c-api"
    changeType: "removed"
    severity: "medium"
    summary: "C-API constant-expression creators removed (LLVMConstExtractValue/InsertValue/UDiv/SDiv/URem/SRem/FAdd/FSub/FMul/FDiv/FRem incl. Exact variants); use the LLVMBuildXYZ APIs instead (they constant-fold when possible)"
    description: |-
        The following functions for creating constant expressions have been removed, because the underlying constant expressions are no longer supported. Instead, an instruction should be created using the LLVMBuildXYZ APIs, which will constant fold the operands if possible and create an instruction otherwise: LLVMConstExtractValue, LLVMConstInsertValue, LLVMConstUDiv, LLVMConstExactUDiv, LLVMConstSDiv, LLVMConstExactSDiv, LLVMConstURem, LLVMConstSRem, LLVMConstFAdd, LLVMConstFSub, LLVMConstFMul, LLVMConstFDiv, LLVMConstFRem.
    affectedApi:
      - "LLVMConstExtractValue"
      - "LLVMConstInsertValue"
      - "LLVMConstUDiv"
      - "LLVMConstExactUDiv"
      - "LLVMConstSDiv"
      - "LLVMConstExactSDiv"
      - "LLVMConstURem"
      - "LLVMConstSRem"
      - "LLVMConstFAdd"
      - "LLVMConstFSub"
      - "LLVMConstFMul"
      - "LLVMConstFDiv"
      - "LLVMConstFRem"
    notes: |-
        Giri is written against the C++ API (no LLVMBuild*/LLVMConst* C-API usage anywhere in the tree), and its only ConstantExpr creation is the cast form (getZExtOrBitCast), which is unaffected. No source interaction.
