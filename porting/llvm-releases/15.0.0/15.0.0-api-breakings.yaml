  # --- Changes to building LLVM ---

  - id: building-cmake-build-type-now-required
    category: "building"
    changeType: "behavior-change"
    severity: "medium"
    summary: "Omitting CMAKE_BUILD_TYPE when using a single-configuration generator is now an error"
    description: |-
        Omitting CMAKE_BUILD_TYPE when using a single configuration generator is now an error. You now have to pass -DCMAKE_BUILD_TYPE=<type> in order to configure LLVM. This is done to help new users of LLVM select the correct type: since building LLVM in Debug mode is very resource intensive, we want to make sure that new users make the choice that lines up with their usage.
    affectedApi:
      - "CMAKE_BUILD_TYPE"
    notes: |-
        Applies to configuring LLVM from source with a single-config generator. The port builds Giri against the prebuilt 15.0.0 toolchain (not LLVM), and the Giri build script (utils/build.sh) already passes -DCMAKE_BUILD_TYPE=Release, so the project configures cleanly. The prebuilt 15.0.0 CMake package imposes no explicit cmake_minimum_required (normal for a prebuilt install), so the Giri CMakeLists.txt floor bump 3.4.3 -> 3.5 (commit 0500b26) is a forward-compatibility choice (CMake 4.x drops support for CMakeLists < 3.5), not a direct LLVM-15 mandate.
    relevance: "irrelevant"
    status: "pending"

